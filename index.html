<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Quest — Adventure</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:monospace}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#hud{position:fixed;top:12px;left:12px;color:#fff;background:#000;border:3px solid #fff;padding:8px;font-weight:900;font-size:17px;text-shadow:2px 2px #000;z-index:2}#help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:#fff;background:#000;border:2px solid #fff;padding:6px 9px;font-size:12px;z-index:2}#msg{position:fixed;inset:0;display:none;place-items:center;background:#000d;color:#fff;font-size:34px;font-weight:900;text-align:center;z-index:5}</style></head><body><canvas id="game"></canvas><div id="hud">LEVEL <b id="lv">1</b>/9 &nbsp; 🪙 <b id="co">0</b> &nbsp; ⭐ <b id="sc">0</b> &nbsp; POWER: <b id="pw">NONE</b></div><div id="help">A/D or ←/→ MOVE • SPACE/W/↑ JUMP</div><div id="msg"></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','w'].includes(k))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let level=1,score=0,coins=0,cam=0,last=performance.now(),jumpLock=false,power='',powerTime=0;
const player={x:100,y:400,w:32,h:48,vx:0,vy:0,on:false};
function makeLevel(n){let ps=[],cs=[],es=[];let start=0;for(let i=0;i<14;i++){let x=i*650;let y=530-(i%4)*35;ps.push({x,y,w:520,h:H+100-y});for(let j=0;j<2;j++)cs.push({x:x+150+j*90,y:y-70,got:false});if(i>0)es.push({x:x+300,y:y-38,w:36,h:38,vx:(i%2?1:-1)*1.3,min:x+80,max:x+450,alive:true})}let powers=[];for(let i=0;i<6;i++)powers.push({x:350+i*1300,y:ps[Math.min(13,Math.floor((350+i*1300)/650))].y-34,w:30,h:30,type:['mushroom','flower','star'][i%3],got:false});return{ps,cs,es,powers,goal:{x:ps[13].x+430,y:ps[13].y-90}}}
let L=makeLevel(1);
function reset(){player.x=100;player.y=L.ps[0].y-player.h;player.vx=player.vy=0;player.on=true;cam=0}
function newLevel(){if(level>=9){level=1;score=0;coins=0}else level++;L=makeLevel(level);power='';powerTime=0;reset()}
function bg(){let sky=['#ff5a18','#d9340a','#ff8b00','#a71908','#ff6517','#8d1707','#ff7b12','#c12a0a','#ff4d13'][level-1];ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffd52f';ctx.fillRect(W-140,55,70,70);for(let i=0;i<16;i++){let x=(i*480-cam*.18),y=300+(i%3)*45;ctx.fillStyle=i%2?'#4a0a00':'#721100';ctx.fillRect(x,y,300,H-y);ctx.fillRect(x+70,y-55,150,55)}for(let i=0;i<40;i++){let x=(i*151-cam*.3)%W;if(x<0)x+=W;ctx.fillStyle='#ffe35b';ctx.fillRect(x,60+(i*61)%330,5,5)}}
function draw(){bg();ctx.save();ctx.translate(-cam,0);for(const q of L.ps){ctx.fillStyle='#4b0b00';ctx.fillRect(q.x,q.y,q.w,q.h);ctx.fillStyle='#e33b08';ctx.fillRect(q.x,q.y,q.w,16);ctx.fillStyle='#ff9b1c';for(let z=q.x;z<q.x+q.w;z+=48)ctx.fillRect(z,q.y+16,25,9)}for(const o of L.cs)if(!o.got){ctx.fillStyle='#ffd52f';ctx.fillRect(o.x-8,o.y-12,16,24);ctx.fillStyle='#fff080';ctx.fillRect(o.x-3,o.y-8,5,16)}for(const q of L.powers)if(!q.got){if(q.type==='mushroom'){ctx.fillStyle='#e52b20';ctx.fillRect(q.x,q.y,30,14);ctx.fillStyle='#fff';ctx.fillRect(q.x+5,q.y+5,6,6);ctx.fillRect(q.x+19,q.y+4,6,6);ctx.fillStyle='#f1d0a0';ctx.fillRect(q.x+6,q.y+14,18,16)}else if(q.type==='flower'){ctx.fillStyle='#ff3045';ctx.fillRect(q.x+5,q.y,20,20);ctx.fillStyle='#ffd52f';ctx.fillRect(q.x,q.y+7,30,10);ctx.fillStyle='#32c653';ctx.fillRect(q.x+12,q.y+17,6,13)}else{ctx.fillStyle='#ffe033';ctx.fillRect(q.x+10,q.y,10,30);ctx.fillRect(q.x,q.y+10,30,10)}}for(const e of L.es)if(e.alive){ctx.fillStyle='#7b3519';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#fff';ctx.fillRect(e.x+7,e.y+8,7,7);ctx.fillRect(e.x+23,e.y+8,7,7)}ctx.fillStyle='#fff';ctx.fillRect(L.goal.x,L.goal.y,8,90);ctx.fillStyle='#ffd52f';ctx.fillRect(L.goal.x+8,L.goal.y,38,25);ctx.fillStyle='#e22';ctx.fillRect(L.goal.x+8,L.goal.y+9,20,7);
ctx.fillStyle=power==='star'?'#ffd52f':power==='flower'?'#ff3045':'#d9342b';ctx.fillRect(player.x+3,player.y+9,26,28);ctx.fillStyle='#2468d8';ctx.fillRect(player.x+6,player.y+28,20,15);ctx.fillStyle='#ffd0a0';ctx.fillRect(player.x+5,player.y-7,22,17);ctx.fillStyle='#592d16';ctx.fillRect(player.x+3,player.y-11,26,5);ctx.fillStyle='#111';ctx.fillRect(player.x+9,player.y-2,4,4);ctx.fillRect(player.x+20,player.y-2,4,4);ctx.fillStyle='#fff';ctx.fillRect(player.x+1,player.y+43,12,5);ctx.fillRect(player.x+19,player.y+43,12,5);if(power){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(player.x-3,player.y-14,38,66)}ctx.restore()}
function update(dt){let left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright,up=keys[' ']||keys.w||keys.arrowup;let speed=power==='mushroom'?8.5:7;if(left)player.vx-=40*dt;if(right)player.vx+=40*dt;if(!left&&!right)player.vx*=.8;player.vx=Math.max(-speed,Math.min(speed,player.vx));if(up&&player.on&&!jumpLock){player.vy=power==='flower'?-15.5:-13;player.on=false;jumpLock=true}if(!up)jumpLock=false;player.vy+=34*dt;player.x+=player.vx;player.y+=player.vy;player.on=false;for(const q of L.ps)if(player.x+player.w>q.x&&player.x<q.x+q.w&&player.y+player.h>=q.y&&player.y+player.h-player.vy*dt<=q.y&&player.vy>=0){player.y=q.y-player.h;player.vy=0;player.on=true}for(const o of L.cs)if(!o.got&&player.x<o.x+14&&player.x+player.w>o.x-14&&player.y<o.y+14&&player.y+player.h>o.y-14){o.got=true;coins++;score+=100}for(const q of L.powers)if(!q.got&&player.x<q.x+q.w&&player.x+player.w>q.x&&player.y<q.y+q.h&&player.y+player.h>q.y){q.got=true;power=q.type;powerTime=12;score+=500}if(powerTime>0){powerTime-=dt}else power='';for(const e of L.es)if(e.alive){e.x+=e.vx;if(e.x<e.min||e.x>e.max)e.vx*=-1;if(player.x<e.x+e.w&&player.x+player.w>e.x&&player.y<e.y+e.h&&player.y+player.h>e.y){if(player.vy>0&&player.y+player.h<e.y+20){e.alive=false;player.vy=-9;score+=250}else reset()}}if(player.x+player.w>L.goal.x&&player.x<L.goal.x+50&&player.y+player.h>L.goal.y)newLevel();if(player.y>H+80)reset();cam+=(Math.max(0,Math.min(L.ps[L.ps.length-1].x+L.ps[L.ps.length-1].w-W,player.x-W*.35))-cam)*Math.min(1,dt*7);document.getElementById('lv').textContent=level;document.getElementById('co').textContent=coins;document.getElementById('sc').textContent=score;document.getElementById('pw').textContent=power?power.toUpperCase()+' '+Math.ceil(powerTime):'NONE'}
function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}reset();draw();requestAnimationFrame(loop);
</script></body></html>
