<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIG TOWER</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05070a;font-family:system-ui}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;color:white;pointer-events:none;text-shadow:0 2px 8px #000}#top{padding:15px;font-weight:900;letter-spacing:3px}#stats{position:absolute;right:15px;top:15px;text-align:right;letter-spacing:1px}#help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#000b;padding:7px 12px;border-radius:8px;font-size:12px}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#000b;z-index:5}.box{width:min(560px,90vw);padding:32px;text-align:center;background:#0c131af5;border:1px solid #ffffff33;border-radius:18px}h1{font-size:52px;margin:0 0 8px;letter-spacing:6px}p{color:#aebac5;line-height:1.6}button{padding:13px 24px;background:#182832;color:#fff;border:1px solid #ffffff55;border-radius:9px;font-weight:900}.small{font-size:11px;letter-spacing:2px;opacity:.65}</style></head><body>
<canvas id="c"></canvas><div id="hud"><div id="top">BIG TOWER</div><div id="stats">FLOOR <b id="floor">1</b><br>FLAPPYS <b id="f">0</b>/3</div><div id="help">A/D or ←/→ MOVE • SPACE/W/↑ JUMP • 3 FLAPPYS = 3 EXTRA JUMPS</div></div>
<div class="overlay" id="menu"><div class="box"><div class="small">TINY SQUARE • MASSIVE TOWER • RESCUE MISSION</div><h1 id="heading">BIG TOWER</h1><p id="desc">Climb the tower one platform at a time. Find three Flappys for extra jumps, dodge traps, and rescue Pineapple at the top.</p><button id="go">START</button></div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));let keys={},playing=false,t=0,cam=0,topY=6000,p,platforms=[],traps=[],items=[],dust=[];
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=1;if([' ','arrowup','w'].includes(k))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function build(){platforms=[];traps=[];items=[];dust=[];let y=0;platforms.push({x:0,y,w:W,h:24});for(let i=1;i<=60;i++){y=i*100;let w=R(150,300),x=R(30,Math.max(31,W-w-30));platforms.push({x,y,w,h:18});if(i%3===0)traps.push({type:'laser',x:x+R(10,w-60),y:y-55,w:R(55,110),phase:R(0,6.28)});if(i%5===0)traps.push({type:'saw',x:x+w/2,y:y-35,r:14,phase:R(0,6.28)});if(i===9||i===25||i===43)items.push({x:x+w/2,y:y-28,type:'flappy'});}items.push({x:W/2,y:topY-55,type:'pineapple'});p={x:W/2-7,y:0,w:14,h:14,vx:0,vy:0,on:false,extra:0};}
build();
function start(){build();playing=true;cam=0;t=0;document.getElementById('menu').style.display='none';document.getElementById('heading').textContent='BIG TOWER';document.getElementById('go').textContent='START'}
function jump(){if(!playing)return;if(p.on){p.vy=-11;p.on=false;return}if(p.extra>0){p.vy=-11;p.extra--;}}
addEventListener('keydown',e=>{if(!e.repeat&&[' ','arrowup','w'].includes(e.key.toLowerCase()))jump()});c.addEventListener('pointerdown',jump);document.getElementById('go').onclick=start;
function die(){playing=false;document.getElementById('heading').textContent='TRY AGAIN';document.getElementById('desc').textContent='You hit a trap or fell. Start again and climb the tower platform by platform.';document.getElementById('go').textContent='RETRY';document.getElementById('menu').style.display='grid'}
function win(){playing=false;document.getElementById('heading').textContent='PINEAPPLE RESCUED!';document.getElementById('desc').textContent='You made it to the top of the tower and rescued your friend.';document.getElementById('go').textContent='PLAY AGAIN';document.getElementById('menu').style.display='grid'}
function update(dt){if(!playing)return;t+=dt;let l=keys.a||keys.arrowleft,r=keys.d||keys.arrowright;p.vx+=(r-l)*.7;p.vx*=.82;p.vx=C(p.vx,-6,6);let old=p.y;p.vy+=.52;p.x+=p.vx;p.y+=p.vy;p.x=C(p.x,4,W-p.w-4);p.on=false;
for(let q of platforms)if(p.x+p.w>q.x&&p.x<q.x+q.w&&old+p.h<=q.y&&p.y+p.h>=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.on=true}
for(let h of traps){if(h.type==='laser'){let on=Math.sin(t*3+h.phase)>.05;if(on&&p.x+p.w>h.x&&p.x<h.x+h.w&&p.y+p.h>h.y&&p.y<h.y+7)die()}else{let sy=h.y+Math.sin(t*2+h.phase)*10;if(Math.hypot(p.x+7-h.x,p.y+7-sy)<h.r+7)die()}}
for(let q of items)if(!q.got&&Math.hypot(p.x+7-q.x,p.y+7-q.y)<22){q.got=true;if(q.type==='flappy'){p.extra=Math.min(3,p.extra+1);document.getElementById('f').textContent=3-p.extra+Math.max(0,0);p.extra=Math.min(3,p.extra);document.getElementById('f').textContent=items.filter(z=>z.type==='flappy'&&z.got).length}else win()}
if(p.y>topY+200)die();if(p.y-cam<H*.42)cam=p.y-H*.42;document.getElementById('floor').textContent=Math.max(1,Math.floor(p.y/100)+1);for(let z of dust){z.x+=z.vx;z.y+=z.vy;z.life-=dt}dust=dust.filter(z=>z.life>0)}
function tower(){let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#111a21');bg.addColorStop(1,'#020305');g.fillStyle=bg;g.fillRect(0,0,W,H);let L=W*.07,Q=W*.93;g.fillStyle='#10191f';g.fillRect(L,0,Q-L,H);g.fillStyle='#061017';g.fillRect(W*.23,0,W*.54,H);
for(let y=-cam%55;y<H+55;y+=55){g.strokeStyle='#27404a';g.lineWidth=2;g.beginPath();g.moveTo(L,y);g.lineTo(Q,y);g.stroke()}g.fillStyle='#0b1115';g.fillRect(L+22,0,16,H);g.fillRect(Q-38,0,16,H);g.fillRect(W*.23-7,0,14,H);g.fillRect(W*.77-7,0,14,H);
for(let y=-cam%31;y<H+31;y+=31)for(let xx=W*.1;xx<W*.9;xx+=25){let lit=Math.sin(xx*1.8+y*2.7+t)>.85;g.globalAlpha=lit?.7:.5;g.fillStyle=lit?'#b6d9d5':'#18303a';g.fillRect(xx,y,14,17)}g.globalAlpha=1;
g.strokeStyle='#40535b';g.lineWidth=7;for(let y=-cam%200-200;y<H+250;y+=200){g.beginPath();g.moveTo(L,y);g.lineTo(W*.23,y+100);g.lineTo(L,y+200);g.stroke();g.beginPath();g.moveTo(Q,y);g.lineTo(W*.77,y+100);g.lineTo(Q,y+200);g.stroke()}}
function draw(){tower();for(let q of platforms){let y=q.y-cam;if(y<-30||y>H+30)continue;g.fillStyle='#3a474d';g.fillRect(q.x,y,q.w,q.h);g.fillStyle='#89949a';g.fillRect(q.x,y,q.w,3);g.fillStyle='#11181c';g.fillRect(q.x+8,y+q.h,q.w-16,6)}
for(let h of traps){let y=h.y-cam;if(h.type==='laser'){let on=Math.sin(t*3+h.phase)>.05;g.globalAlpha=on?.95:.12;g.fillStyle='#ff3048';g.shadowColor='#ff3048';g.shadowBlur=on?18:2;g.fillRect(h.x,y,h.w,7);g.shadowBlur=0;g.globalAlpha=1}else{let sy=y+Math.sin(t*2+h.phase)*10;g.save();g.translate(h.x,sy);g.rotate(t*4);g.fillStyle='#252b2f';g.strokeStyle='#d0d5d7';g.beginPath();for(let i=0;i<16;i++){let a=i*Math.PI/8,r=i%2?h.r:h.r*.6;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.stroke();g.restore()}}
for(let q of items)if(!q.got){let y=q.y-cam;g.save();g.translate(q.x,y);g.shadowColor='#7ff4ff';g.shadowBlur=18;g.fillStyle='#bffcff';g.beginPath();g.arc(0,0,10,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#17323b';g.font='bold 10px system-ui';g.textAlign='center';g.fillText(q.type==='flappy'?'F':'P',0,4);g.restore()}
g.save();g.translate(p.x+7,p.y-cam+7);g.shadowColor='#76eaff';g.shadowBlur=18;let pg=g.createLinearGradient(-7,-7,7,7);pg.addColorStop(0,'#fff');pg.addColorStop(.4,'#73eaff');pg.addColorStop(1,'#19719f');g.fillStyle=pg;g.fillRect(-7,-7,14,14);g.shadowBlur=0;g.fillStyle='#06151c';g.fillRect(-2,-2,4,4);g.restore()}
let last=0;function loop(n){let dt=Math.min(.032,(n-last)/1000||0);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
