<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Quest — Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;font-family:system-ui,Arial,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:auto}
#hud{position:fixed;top:14px;left:14px;display:flex;gap:10px;flex-wrap:wrap;color:#fff;font-weight:800;font-size:18px;text-shadow:0 2px 4px #000;z-index:5}
.pill{padding:8px 12px;border:1px solid #ffffff44;border-radius:12px;background:#07111dcc;backdrop-filter:blur(5px)}
#help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);padding:7px 12px;color:#fff;background:#07111dbb;border-radius:10px;font-size:14px;text-shadow:0 1px 3px #000;z-index:5}
#screen{position:fixed;inset:0;display:none;place-items:center;background:#0009;z-index:10}
.card{padding:30px 36px;text-align:center;color:#fff;background:#101a2bf2;border:1px solid #ffffff2b;border-radius:20px;box-shadow:0 20px 60px #0008}
.card h1{margin:0 0 10px;font-size:46px}.card p{margin:0 0 20px;color:#c9d7e8}
button{border:0;border-radius:12px;padding:12px 22px;font-weight:800;font-size:17px;cursor:pointer;background:#ffd34d;color:#231900}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">❤ <span id="lives">3</span></div><div class="pill">⭐ <span id="score">0</span></div></div>
<div id="help">A/D or ←/→ to move • Space/W/↑ to jump</div>
<div id="screen"><div class="card"><h1 id="title">Game Over</h1><p id="subtitle"></p><button id="restart">Play Again</button></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();

const keys={}; let jumpPressed=false;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','a','d','w'].includes(k))e.preventDefault();if(!keys[k]&&(k===' '||k==='w'||k==='arrowup'))jumpPressed=true;keys[k]=true});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const world={w:12000};
const player={x:120,y:300,w:34,h:52,vx:0,vy:0,ground:false,coyote:0,jumpBuffer:0,face:1,inv:0,run:0};
const platforms=[
{x:0,y:560,w:1100,h:120},{x:1250,y:560,w:600,h:120},{x:1980,y:500,w:600,h:180},
{x:2700,y:560,w:900,h:120},{x:3800,y:480,w:650,h:200},{x:4620,y:560,w:1000,h:120},
{x:6900,y:500,w:700,h:180},{x:7800,y:560,w:1200,h:120},{x:9200,y:480,w:800,h:200},
{x:10150,y:560,w:1850,h:120}
];
const blocks=[
{x:450,y:450,w:52,h:52},{x:502,y:450,w:52,h:52},{x:900,y:390,w:52,h:52},
{x:1450,y:440,w:52,h:52},{x:1502,y:388,w:52,h:52},{x:2160,y:400,w:52,h:52},
{x:2820,y:450,w:52,h:52},{x:2872,y:450,w:52,h:52},{x:3980,y:390,w:52,h:52},
{x:4700,y:450,w:52,h:52},{x:4752,y:398,w:52,h:52},{x:5200,y:400,w:52,h:52},
{x:7100,y:390,w:52,h:52},{x:8250,y:450,w:52,h:52},{x:9500,y:390,w:52,h:52},
{x:10500,y:450,w:52,h:52}
];
const coins=[];
function addCoins(x,y,n,dx=52){for(let i=0;i<n;i++)coins.push({x:x+i*dx,y,got:false,t:Math.random()*6.28})}
addCoins(220,470,8);addCoins(1320,470,7);addCoins(2020,410,7);addCoins(2750,470,10);addCoins(3860,400,7);addCoins(4650,470,12);addCoins(6950,410,7);addCoins(7850,470,10);addCoins(9250,390,8);addCoins(10200,470,14);

const enemies=[
{x:700,y:518,w:40,h:42,vx:-1.3,min:350,max:1030,alive:true},
{x:1430,y:518,w:40,h:42,vx:1.5,min:1280,max:1820,alive:true},
{x:2190,y:458,w:40,h:42,vx:-1.5,min:2000,max:2550,alive:true},
{x:3150,y:518,w:40,h:42,vx:1.7,min:2750,max:3550,alive:true},
{x:4000,y:438,w:40,h:42,vx:-1.4,min:3830,max:4420,alive:true},
{x:5000,y:518,w:40,h:42,vx:1.6,min:4680,max:6100,alive:true},
{x:7200,y:458,w:40,h:42,vx:-1.5,min:6950,max:7550,alive:true},
{x:8500,y:518,w:40,h:42,vx:1.7,min:8000,max:8950,alive:true},
{x:9500,y:438,w:40,h:42,vx:-1.4,min:9250,max:9950,alive:true},
{x:10800,y:518,w:40,h:42,vx:1.8,min:10200,max:11600,alive:true}
];
const goal={x:11750,y:455,w:26,h:105};
let cam=0,coinsGot=0,lives=3,score=0,ended=false,last=performance.now(),shake=0;
const particles=[];
function spawn(x,y,n,color){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,life:.4+Math.random()*.5,color,s:2+Math.random()*4})}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function resetPlayer(){player.x=120;player.y=400;player.vx=0;player.vy=0;player.inv=1.5;cam=0}
function hurt(){if(player.inv>0)return;lives--;shake=12;spawn(player.x+player.w/2,player.y+player.h/2,18,'#ff6b6b');if(lives<=0){end('GAME OVER','You scored '+score+' points.')}else resetPlayer()}
function end(t,s){ended=true;document.getElementById('title').textContent=t;document.getElementById('subtitle').textContent=s;document.getElementById('screen').style.display='grid'}
function restart(){coins.forEach(o=>o.got=false);enemies.forEach(e=>e.alive=true);coinsGot=0;lives=3;score=0;ended=false;player.inv=0;resetPlayer();document.getElementById('screen').style.display='none'}
document.getElementById('restart').onclick=restart;

function solidCollision(){
 player.ground=false;
 const solids=platforms.concat(blocks);
 const oldBottom=player.y+player.h-player.vy;
 for(const p of solids){
  if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>p.y&&oldBottom<=p.y&&player.vy>=0){
   player.y=p.y-player.h;player.vy=0;player.ground=true;
  }
 }
}
function update(dt){
 if(ended)return;
 dt=Math.min(dt,0.033);
 if(player.inv>0)player.inv-=dt;
 const left=keys['arrowleft']||keys['a'],right=keys['arrowright']||keys['d'];
 const accel=player.ground?48:34, max=7.5;
 if(left){player.vx-=accel*dt;player.face=-1} if(right){player.vx+=accel*dt;player.face=1}
 if(!left&&!right){const drag=player.ground?12:3;player.vx-=Math.sign(player.vx)*Math.min(Math.abs(player.vx),drag*dt)}
 player.vx=Math.max(-max,Math.min(max,player.vx));
 if(player.ground)player.coyote=.11;else player.coyote=Math.max(0,player.coyote-dt);
 if(jumpPressed)player.jumpBuffer=.12;else player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);
 jumpPressed=false;
 if(player.jumpBuffer>0&&player.coyote>0){player.vy=-13.8;player.ground=false;player.coyote=0;player.jumpBuffer=0;spawn(player.x+player.w/2,player.y+player.h,8,'#d8e6ee')}
 if(!(keys[' ']||keys['w']||keys['arrowup'])&&player.vy<-5)player.vy+=22*dt;
 player.vy+=36*dt;player.vy=Math.min(player.vy,20);
 player.x+=player.vx;player.y+=player.vy;
 if(player.x<0)player.x=0;
 solidCollision();
 if(player.ground&&Math.abs(player.vx)>1)player.run+=dt*12;else player.run+=dt*4;
 for(const o of coins)if(!o.got){o.t+=dt*5;const box={x:o.x-11,y:o.y-11,w:22,h:22};if(overlap(player,box)){o.got=true;coinsGot++;score+=100;spawn(o.x,o.y,10,'#ffd54a')}}
 for(const e of enemies)if(e.alive){e.x+=e.vx;if(e.x<e.min||e.x>e.max)e.vx*=-1;const box={x:e.x,y:e.y,w:e.w,h:e.h};if(overlap(player,box)){const stomp=player.vy>0&&player.y+player.h-player.vy<=e.y+12;if(stomp){e.alive=false;player.vy=-9;score+=250;spawn(e.x+20,e.y+20,16,'#b48cff')}else hurt()}}
 if(player.y>H+180)hurt();
 if(overlap(player,goal))end('LEVEL COMPLETE!','Coins: '+coinsGot+'  •  Score: '+score);
 const target=player.x-W*.35;cam+=(Math.max(0,Math.min(world.w-W,target))-cam)*Math.min(1,dt*7);
 shake=Math.max(0,shake-dt*30);
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=12*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 document.getElementById('coins').textContent=coinsGot;document.getElementById('lives').textContent=lives;document.getElementById('score').textContent=score;
}
function cloud(x,y,s){ctx.fillStyle='#ffffffb8';ctx.beginPath();ctx.arc(x,y,24*s,0,7);ctx.arc(x+30*s,y-12*s,31*s,0,7);ctx.arc(x+65*s,y,22*s,0,7);ctx.fill()}
function drawBG(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5aaef5');g.addColorStop(.62,'#bfe8ff');g.addColorStop(1,'#f4d5a2');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ffe49a';ctx.beginPath();ctx.arc(W-120,90,42,0,7);ctx.fill();
 for(let i=0;i<18;i++){let x=i*620-cam*.18;cloud(x,80+(i%3)*55,.8+(i%2)*.2)}
 for(let i=0;i<22;i++){let x=i*600-cam*.35;ctx.fillStyle='#79a96d';ctx.beginPath();ctx.moveTo(x,H*.65);ctx.lineTo(x+180,H*.34);ctx.lineTo(x+360,H*.65);ctx.fill()}
 for(let i=0;i<26;i++){let x=i*470-cam*.52;const base=H*.78;ctx.fillStyle='#477c50';ctx.fillRect(x+25,base-90,18,90);ctx.beginPath();ctx.arc(x+34,base-105,48,0,7);ctx.fill()}
}
function platform(p){
 const x=p.x-cam;if(x+p.w<0||x>W)return;
 ctx.fillStyle='#3d271b';ctx.fillRect(x,p.y,p.w,p.h);
 ctx.fillStyle='#2e7d4a';ctx.fillRect(x,p.y,p.w,18);
 ctx.fillStyle='#58b95e';for(let i=0;i<p.w;i+=30)ctx.fillRect(x+i,p.y+18,18,5);
 ctx.fillStyle='#513524';for(let i=10;i<p.w;i+=42)ctx.fillRect(x+i,p.y+45,10,10);
}
function block(b){
 const x=b.x-cam;ctx.fillStyle='#d98d2b';ctx.fillRect(x,b.y,b.w,b.h);ctx.strokeStyle='#7b4b1a';ctx.lineWidth=3;ctx.strokeRect(x+1,b.y+1,b.w-2,b.h-2);
 ctx.fillStyle='#ffd77a';ctx.fillRect(x+7,b.y+7,b.w-14,5);ctx.font='bold 27px Arial';ctx.textAlign='center';ctx.fillStyle='#fff2a9';ctx.fillText('?',x+b.w/2,b.y+37);
}
function coin(o){const x=o.x-cam,y=o.y+Math.sin(o.t)*4;ctx.save();ctx.translate(x,y);ctx.scale(.45+.55*Math.abs(Math.cos(o.t*.55)),1);ctx.fillStyle='#ffd43b';ctx.beginPath();ctx.ellipse(0,0,12,16,0,0,7);ctx.fill();ctx.strokeStyle='#b9790b';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function enemy(e){const x=e.x-cam;ctx.fillStyle='#6938a8';ctx.beginPath();ctx.roundRect(x,e.y,e.w,e.h,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+8,e.y+9,9,10);ctx.fillRect(x+24,e.y+9,9,10);ctx.fillStyle='#111';ctx.fillRect(x+11,e.y+12,4,5);ctx.fillRect(x+27,e.y+12,4,5);ctx.fillStyle='#3a225f';ctx.fillRect(x-3,e.y+e.h-6,16,8);ctx.fillRect(x+27,e.y+e.h-6,16,8)}
function playerDraw(){
 const x=player.x-cam,y=player.y;if(player.inv>0&&Math.floor(player.inv*12)%2===0)return;
 ctx.save();ctx.translate(x+player.w/2,y+player.h/2);ctx.scale(player.face,1);
 const bob=player.ground?Math.sin(player.run)*1.5:0;ctx.translate(0,bob);
 ctx.fillStyle='#26344d';ctx.fillRect(-15,5,30,30);ctx.fillStyle='#35a8ff';ctx.fillRect(-15,2,30,25);
 ctx.fillStyle='#ffd0a3';ctx.fillRect(-12,-23,24,25);ctx.fillStyle='#4b2f20';ctx.fillRect(-14,-27,28,8);ctx.fillRect(-16,-22,6,9);
 ctx.fillStyle='#182030';ctx.fillRect(-11,27,10,7);ctx.fillRect(2,27,11,7);
 ctx.fillStyle='#111';ctx.fillRect(5,-16,4,5);ctx.fillStyle='#fff';ctx.fillRect(-8,7,16,4);
 ctx.restore();
}
function drawGoal(){const x=goal.x-cam;ctx.fillStyle='#eee';ctx.fillRect(x,goal.y,7,105);ctx.fillStyle='#ef476f';ctx.beginPath();ctx.moveTo(x+7,goal.y);ctx.lineTo(x+58,goal.y+18);ctx.lineTo(x+7,goal.y+37);ctx.fill();ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(x+3.5,goal.y,8,0,7);ctx.fill()}
function render(){
 drawBG();const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.save();ctx.translate(sx,sy);
 for(const p of platforms)platform(p);for(const b of blocks)block(b);for(const o of coins)if(!o.got&&o.x-cam>-30&&o.x-cam<W+30)coin(o);for(const e of enemies)if(e.alive)enemy(e);drawGoal();playerDraw();
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*1.5);ctx.fillStyle=p.color;ctx.fillRect(p.x-cam,p.y,p.s,p.s)}ctx.globalAlpha=1;ctx.restore();
}
function loop(t){const dt=(t-last)/1000;last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
