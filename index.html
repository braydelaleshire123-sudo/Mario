<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG FLAPPY TOWER — TINY SQUARE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2c91ad;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #123;z-index:2}
#brand{position:absolute;top:12px;left:14px;font-weight:900;letter-spacing:2px}
#stats{position:absolute;top:12px;right:14px;text-align:right;font-size:13px;line-height:1.5}
#help{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#173f4acc;padding:7px 11px;border-radius:7px;font-size:12px;white-space:nowrap}
#screen{position:fixed;inset:0;display:grid;place-items:center;background:#0008;z-index:5}
.card{width:min(600px,92vw);padding:34px;text-align:center;background:#d9e9e9;border:4px solid #173f4c;border-radius:12px;box-shadow:0 18px 60px #0008}
h1{margin:0 0 10px;color:#173f4c;font-size:clamp(34px,7vw,60px);letter-spacing:2px}
p{color:#315663;line-height:1.5}
button{padding:13px 30px;border:3px solid #173f4c;border-radius:8px;background:#ef5d52;color:#fff;font-weight:900;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="brand">BIG FLAPPY TOWER</div>
  <div id="stats">CHECKPOINT <b id="cp">1</b><br>AIR JUMPS <b id="jumps">3</b>/3</div>
  <div id="help">A/D or ←/→ MOVE • SPACE / W / ↑ FLAP • R CHECKPOINT</div>
</div>
<div id="screen">
  <div class="card">
    <h1 id="st">BIG FLAPPY TOWER</h1>
    <p id="msg">A giant precision tower. Three air-jumps, tight platforms, red barriers, pipes, moving hazards and checkpoints. Reach the red button and rescue Pineapple.</p>
    <button id="go">START GAME</button>
  </div>
</div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}addEventListener("resize",resize);

const G={playing:false,t:0,cam:0,checkpoint:0,keys:{},sectionH:0,totalH:0,spawnGrace:0};
let player,platforms,hazards,boxes,checkpoints,button,pineapple,audio;

function buildWorld(){
  G.sectionH=Math.max(560,H*.94);
  const sections=8, towerL=Math.max(26,W*.08), towerR=Math.min(W-26,W*.92), tw=towerR-towerL;
  G.totalH=sections*G.sectionH;
  platforms=[];hazards=[];boxes=[];checkpoints=[];
  const patterns=[
    [[.08,55,.28],[.50,155,.23],[.22,285,.27],[.62,415,.22],[.38,535,.30]],
    [[.58,55,.25],[.20,175,.22],[.46,300,.30],[.08,430,.24],[.55,545,.25]],
    [[.14,55,.30],[.55,175,.22],[.34,300,.22],[.68,420,.22],[.18,535,.28]],
    [[.48,55,.28],[.10,170,.25],[.40,290,.23],[.68,405,.24],[.25,530,.25]]
  ];
  for(let s=0;s<sections;s++){
    const base=G.totalH-(s+1)*G.sectionH;
    const pat=patterns[s%patterns.length];
    pat.forEach((a,i)=>{
      const x=towerL+tw*a[0], y=base+G.sectionH-a[1];
      platforms.push({x,y,w:Math.max(82,tw*a[2]),h:18,section:s,i});
    });
    // A safe bridge platform near the top of each screen.
    const bridgeX=towerL+tw*(s%2?.68:.12);
    platforms.push({x:bridgeX,y:base+42,w:tw*.18,h:18,section:s,i:9});
    if(s<sections-1) boxes.push({x:towerL+tw*(s%2?.43:.57),y:base+110,w:30,h:26,used:false,phase:s});
    if(s>0) checkpoints.push({x:towerL+tw*(s%2?.76:.16),y:base+70,w:52,h:12,section:s});
    // Red beam obstacles, inspired by the game's clean geometric hazards.
    hazards.push({type:"beam",x:towerL+tw*(s%2?.08:.42),y:base+G.sectionH-245,w:tw*(s%2?.55:.48),h:12,phase:s});
    hazards.push({type:"beam",x:towerL+tw*(s%2?.40:.06),y:base+G.sectionH-455,w:tw*.40,h:12,phase:s+2});
    if(s%3===0) hazards.push({type:"blade",x:towerL+tw*.50,y:base+G.sectionH-350,r:20,phase:s});
    if(s%4===1) hazards.push({type:"pipe",x:towerL+tw*.75,y:base+G.sectionH-180,w:38,h:115});
  }
  // GUARANTEED STARTER ROUTE: put a clear staircase directly above Tiny Square.
  // These are intentionally close together so the player can immediately see where to go.
  const starter=[
    {x:towerL+tw*.12,y:G.totalH-55,w:tw*.28,h:18,section:7,i:100},
    {x:towerL+tw*.55,y:G.totalH-155,w:tw*.25,h:18,section:7,i:101},
    {x:towerL+tw*.30,y:G.totalH-270,w:tw*.28,h:18,section:7,i:102},
    {x:towerL+tw*.62,y:G.totalH-390,w:tw*.24,h:18,section:7,i:103},
    {x:towerL+tw*.20,y:G.totalH-510,w:tw*.30,h:18,section:7,i:104},
    {x:towerL+tw*.52,y:G.totalH-635,w:tw*.27,h:18,section:7,i:105}
  ];
  platforms.push(...starter);

  const top=0;
  button={x:W/2-28,y:top+72,w:56,h:24};
  pineapple={x:W/2,y:top+125,collected:false};
  const startPlatform=starter[0];
  player={x:startPlatform.x+startPlatform.w*.5-10,y:startPlatform.y-20,w:20,h:20,vx:0,vy:0,onGround:true,airJumps:3};
  G.spawnGrace=120;
  G.cam=Math.max(0,G.totalH-H);G.checkpoint=0;
}

function music(){
  if(audio)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audio=new AC();const master=audio.createGain();master.gain.value=.035;master.connect(audio.destination);
    const notes=[196,246.94,293.66,246.94,220,261.63,329.63,261.63];let n=0;
    setInterval(()=>{if(!audio||audio.state!=="running")return;const o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=notes[n++%notes.length];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.5,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.22);o.connect(g);g.connect(master);o.start();o.stop(audio.currentTime+.24)},300);
  }catch(e){}
}
function start(){buildWorld();G.playing=true;G.t=0;G.spawnGrace=120;document.getElementById("screen").style.display="none";music();if(audio&&audio.state==="suspended")audio.resume()}
function checkpointRespawn(){const s=G.checkpoint;buildWorld();G.checkpoint=s;const p=platforms.find(q=>q.section===s&&q.i===9)||platforms.find(q=>q.section===s);player.x=p.x+p.w*.5-player.w*.5;player.y=p.y-player.h-2;player.vx=0;player.vy=0;player.airJumps=3;G.spawnGrace=90;G.cam=Math.max(0,Math.min(G.totalH-H,player.y-H*.58));G.playing=true;document.getElementById("screen").style.display="none"}
function die(){G.playing=false;document.getElementById("st").textContent="BACK TO CHECKPOINT";document.getElementById("msg").textContent="You hit a hazard. The tower is built from repeatable screen-sized challenge sections, so try the same section again.";document.getElementById("go").textContent="RESPAWN";document.getElementById("screen").style.display="grid"}
function win(){G.playing=false;document.getElementById("st").textContent="PINEAPPLE RESCUED!";document.getElementById("msg").textContent="You reached the top of the tower and hit the final button.";document.getElementById("go").textContent="PLAY AGAIN";document.getElementById("screen").style.display="grid"}

function jump(){
  if(!G.playing)return;
  if(player.onGround){player.vy=-12.5;player.onGround=false;player.airJumps=3}
  else if(player.airJumps>0){player.vy=-10.8;player.airJumps--}
}
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();G.keys[k]=true;
  if([" ","arrowup","w"].includes(k)){e.preventDefault();if(!e.repeat)jump()}
  if(k==="r"){e.preventDefault();checkpointRespawn()}
});
addEventListener("keyup",e=>G.keys[e.key.toLowerCase()]=false);
canvas.addEventListener("pointerdown",jump);
document.getElementById("go").onclick=()=>document.getElementById("go").textContent==="RESPAWN"?checkpointRespawn():start();

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(){
  if(!G.playing)return;
  G.t+=1/60;
  const left=G.keys.a||G.keys.arrowleft,right=G.keys.d||G.keys.arrowright;
  player.vx+=(right-left)*.72;player.vx*=.84;player.vx=Math.max(-6,Math.min(6,player.vx));
  const oldBottom=player.y+player.h;
  player.vy+=.52;player.x+=player.vx;player.y+=player.vy;
  const L=Math.max(26,W*.08),R=Math.min(W-26,W*.92);
  player.x=Math.max(L,Math.min(R-player.w,player.x));
  player.onGround=false;
  for(const p of platforms){
    if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&oldBottom<=p.y&&player.y+player.h>=p.y){
      player.y=p.y-player.h;player.vy=0;player.onGround=true;player.airJumps=3;break;
    }
  }
  // Wall jump, but keep it snappy instead of floaty.
  if(!player.onGround&&(player.x<=L+1||player.x+player.w>=R-1)&&player.vy>0&&(left||right)){player.vy=-9.5;player.vx=right?-6:6}
  for(const b of boxes){
    const by=b.y+Math.sin(G.t*2+b.phase)*7;
    const box={x:b.x,y:by,w:b.w,h:b.h};
    if(!b.used&&overlap(player,box)){b.used=true;player.airJumps=3;player.vy=-9}
  }
  if(G.spawnGrace>0)G.spawnGrace--;
  for(const h of hazards){
    if(G.spawnGrace<=0){
      if(h.type==="beam"&&overlap(player,{x:h.x,y:h.y,w:h.w,h:h.h})){die();return}
      if(h.type==="pipe"&&overlap(player,{x:h.x,y:h.y,w:h.w,h:h.h})){die();return}
      if(h.type==="blade"){const sy=h.y+Math.sin(G.t*2+h.phase)*24;if(Math.hypot(player.x+10-h.x,player.y+10-sy)<h.r+9){die();return}}
    }
  }
  for(const c of checkpoints){
    if(player.y<c.y+35&&player.y>c.y-40&&player.x+player.w>c.x&&player.x<c.x+c.w)G.checkpoint=Math.max(G.checkpoint,c.section);
  }
  if(overlap(player,button)){button.hit=true}
  if(button.hit&&overlap(player,pineappleBox())){pineapple.collected=true;win();return}
  if(player.y>G.totalH+150 && G.spawnGrace<=0){checkpointRespawn();return}
  const target=H*.55;
  G.cam=player.y-target;
  G.cam=Math.max(0,Math.min(G.totalH-H,G.cam));
  document.getElementById("cp").textContent=G.checkpoint+1;
  document.getElementById("jumps").textContent=player.airJumps;
}
function pineappleBox(){return{x:pineapple.x-20,y:pineapple.y-25,w:40,h:55}}

function draw(){
  const L=Math.max(26,W*.08),R=Math.min(W-26,W*.92);
  ctx.fillStyle="#2c91ad";ctx.fillRect(0,0,W,H);
  // Large clean tower chamber.
  ctx.fillStyle="#3da0b8";ctx.fillRect(L,0,R-L,H);
  // faint panel lines
  ctx.strokeStyle="#318aa3";ctx.lineWidth=2;
  for(let x=L+40;x<R;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  // tower side walls
  ctx.fillStyle="#e5c55e";ctx.fillRect(L-13,0,13,H);ctx.fillRect(R,0,13,H);
  ctx.fillStyle="#668e58";ctx.fillRect(L-7,0,7,H);ctx.fillRect(R,0,7,H);
  for(let y=-(G.cam%28);y<H+28;y+=28){ctx.fillStyle="#82a968";ctx.fillRect(L-10,y,10,10);ctx.fillRect(R,y,10,10)}
  // screen boundary
  const section=Math.floor((G.totalH-player.y)/G.sectionH);
  ctx.fillStyle="#ffffff18";ctx.fillRect(L+1,H*.02,R-L-2,3);

  for(const p of platforms){
    const y=p.y-G.cam;if(y<-35||y>H+35)continue;
    ctx.fillStyle="#dfc45d";ctx.fillRect(p.x,y,p.w,p.h);
    ctx.strokeStyle="#638d55";ctx.lineWidth=5;ctx.strokeRect(p.x,y,p.w,p.h);
    ctx.fillStyle="#f4d875";ctx.fillRect(p.x+6,y+4,p.w-12,5);
  }
  for(const h of hazards){
    if(h.type==="beam"){
      const y=h.y-G.cam;ctx.fillStyle="#e85b50";ctx.fillRect(h.x,y,h.w,h.h);
      ctx.fillStyle="#ff8b79";ctx.fillRect(h.x,y,h.w,3);
      ctx.fillStyle="#c74742";ctx.fillRect(h.x,y+h.h,h.w,5);
    }else if(h.type==="pipe"){
      const y=h.y-G.cam;ctx.fillStyle="#e65a50";ctx.fillRect(h.x,y,h.w,h.h);ctx.fillStyle="#ff8170";ctx.fillRect(h.x-6,y-8,h.w+12,14);ctx.fillStyle="#bd4540";ctx.fillRect(h.x-6,y+h.h-4,h.w+12,12);
    }else{
      const y=h.y-G.cam+Math.sin(G.t*2+h.phase)*24;ctx.save();ctx.translate(h.x,y);ctx.rotate(G.t*5);ctx.fillStyle="#dce8e8";ctx.strokeStyle="#52717a";ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8,r=i%2?h.r:h.r*.42;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    }
  }
  // Checkpoints
  for(const c of checkpoints){const y=c.y-G.cam;ctx.fillStyle=c.section<=G.checkpoint?"#59d27a":"#a8b8b4";ctx.fillRect(c.x,y,c.w,12);ctx.fillStyle="#e9f5e9";ctx.font="bold 10px Arial";ctx.fillText("CP",c.x+16,y-4)}
  // Floating refill boxes
  for(const b of boxes)if(!b.used){const y=b.y-G.cam+Math.sin(G.t*2+b.phase)*7;ctx.fillStyle="#d9a83e";ctx.fillRect(b.x,y,b.w,b.h);ctx.strokeStyle="#71572a";ctx.lineWidth=3;ctx.strokeRect(b.x,y,b.w,b.h);ctx.fillStyle="#fff2b1";ctx.font="bold 18px Arial";ctx.fillText("↑",b.x+8,y+20)}
  // Final red button + pineapple
  const by=button.y-G.cam;ctx.fillStyle="#b63d39";ctx.fillRect(button.x-8,by+button.h,button.w+16,8);ctx.fillStyle=button.hit?"#75e26f":"#ef5d52";ctx.fillRect(button.x,by,button.w,button.h);ctx.strokeStyle="#7d302f";ctx.lineWidth=3;ctx.strokeRect(button.x,by,button.w,button.h);
  if(!pineapple.collected){const py=pineapple.y-G.cam;ctx.save();ctx.translate(pineapple.x,py);ctx.fillStyle="#e7b938";ctx.beginPath();ctx.ellipse(0,8,13,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#59a64f";ctx.beginPath();ctx.moveTo(-10,-8);ctx.lineTo(-5,-24);ctx.lineTo(0,-10);ctx.lineTo(6,-24);ctx.lineTo(10,-8);ctx.fill();ctx.restore()}
  // Tiny Square + three flap feathers
  const px=player.x+10,py=player.y-G.cam+10;
  ctx.save();ctx.translate(px,py);
  ctx.fillStyle="#69d85b";ctx.fillRect(-10,-10,20,20);ctx.strokeStyle="#286b3a";ctx.lineWidth=3;ctx.strokeRect(-10,-10,20,20);
  ctx.fillStyle="#f4f7e8";ctx.fillRect(-7,-18,5,7);ctx.fillRect(-1,-21,5,10);ctx.fillRect(5,-18,5,7);
  ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop)}
resize();buildWorld();requestAnimationFrame(loop);
</script>
</body>
</html>
