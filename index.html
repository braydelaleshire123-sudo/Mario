<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Quest — Adventure</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ff6b18;font-family:monospace}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#boot{position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#ff5a00;font:900 42px monospace;z-index:0}#hud{position:fixed;top:12px;left:12px;color:#fff;font-weight:900;font-size:18px;text-shadow:3px 3px #000;background:#000;padding:8px;border:3px solid #fff}#help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:#fff;background:#000;padding:7px;border:2px solid #fff;font-size:12px}</style></head><body>
<div id="boot">PIXEL QUEST</div><canvas id="game"></canvas><div id="hud">LEVEL <span id="lv">1</span>/9 &nbsp; 🪙 <span id="co">0</span> &nbsp; ⭐ <span id="sc">0</span></div><div id="help">A/D or ←/→ MOVE • SPACE/W/↑ JUMP</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');document.getElementById('boot').style.display='none';let W,H,d=1;function size(){W=innerWidth;H=innerHeight;d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);x.imageSmoothingEnabled=false}addEventListener('resize',size);size();
const K={};addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
let level=1,score=0,coins=0,cam=0,jump=0,last=performance.now();
const p={x:100,y:420,w:32,h:48,vx:0,vy:0,on:0};
function platforms(){let out=[];let base=520;for(let i=0;i<10;i++){let gap=(i%3===1)?120:40;out.push({x:i*650,y:base-(i%3)*45,w:520-gap,h:200})}return out}
let ps=platforms();
// Always keep a continuous safety floor so the player cannot fall forever.
ps.unshift({x:-20000,y:520,w:50000,h:300});
let goal={x:ps[ps.length-1].x+430,y:ps[ps.length-1].y-70};
let cs=Array.from({length:25},(_,i)=>({x:180+i*250,y:360-(i%3)*35,t:0,got:0}));
let powers=Array.from({length:9},(_,i)=>({x:520+i*650,y:380-(i%3)*45,w:28,h:28,type:['mushroom','flower','star'][i%3],got:0,t:0}));
let powerType='';let powerTime=0;
function reset(){p.x=100;p.y=472;p.vx=p.vy=0;cam=0;p.on=1}
function next(){if(level>=9){level=1;score=0;coins=0}else level++;ps=platforms();ps.unshift({x:-20000,y:520,w:50000,h:300});goal={x:ps[ps.length-1].x+430,y:ps[ps.length-1].y-70};cs=Array.from({length:25},(_,i)=>({x:180+i*250,y:360-(i%3)*35,t:0,got:0}));reset()}
function bg(){x.fillStyle='#ff6517';x.fillRect(0,0,W,H);x.fillStyle='#ffcf32';x.fillRect(W-150,55,80,80);for(let i=0;i<12;i++){let xx=i*500-cam*.18;x.fillStyle=i%2?'#8b1800':'#5b0b00';x.fillRect(xx,360,300,170);x.fillRect(xx+70,300,160,60)}for(let i=0;i<35;i++){let xx=(i*173-cam*.3)%W;if(xx<0)xx+=W;x.fillStyle='#ffe45c';x.fillRect(xx,70+(i*47)%280,5,5)}}
function draw(){bg();x.save();x.translate(-cam,0);for(const q of ps){x.fillStyle='#531000';x.fillRect(q.x,q.y,q.w,q.h);x.fillStyle='#d83b08';x.fillRect(q.x,q.y,q.w,18);x.fillStyle='#ff9b18';for(let z=q.x;z<q.x+q.w;z+=48)x.fillRect(z,q.y+18,24,12)}for(const o of cs)if(!o.got){o.t+=.1;x.fillStyle='#ffd62e';x.fillRect(o.x-8,o.y-12,16,24);x.fillStyle='#fff07a';x.fillRect(o.x-3,o.y-8,5,16)}for(const q of powers)if(!q.got){q.t+=.08;if(q.type==='mushroom'){x.fillStyle='#e52b20';x.fillRect(q.x,q.y,q.w,q.h/2);x.fillStyle='#fff';x.fillRect(q.x+4,q.y+12,20,16);x.fillStyle='#fff';x.fillRect(q.x+5,q.y+3,5,5);x.fillRect(q.x+18,q.y+3,5,5)}else if(q.type==='flower'){x.fillStyle='#ff3344';x.fillRect(q.x+6,q.y,q.w-12,12);x.fillStyle='#ffd62e';x.fillRect(q.x+2,q.y+7,24,12);x.fillStyle='#39c95a';x.fillRect(q.x+11,q.y+18,7,10)}else{x.fillStyle='#ffe033';x.fillRect(q.x+11,q.y,q.w-22,q.h);x.fillRect(q.x,q.y+11,q.w,q.h-22);}}x.fillStyle='#fff';x.fillRect(goal.x,goal.y,8,75);x.fillStyle='#ffe033';x.fillRect(goal.x+8,goal.y,34,25);x.fillStyle='#e92713';x.fillRect(goal.x+8,goal.y+8,18,8);x.fillStyle='#d92b20';x.fillRect(p.x+3,p.y+7,26,30);x.fillStyle='#1d63d8';x.fillRect(p.x+6,p.y+27,20,17);x.fillStyle='#ffd0a0';x.fillRect(p.x+5,p.y-7,22,17);x.fillStyle='#5a2d16';x.fillRect(p.x+4,p.y-11,24,7);x.fillStyle='#111';x.fillRect(p.x+9,p.y-2,4,4);x.fillRect(p.x+20,p.y-2,4,4);x.fillStyle='#fff';x.fillRect(p.x+2,p.y+43,11,5);x.fillRect(p.x+19,p.y+43,11,5);x.restore()}
function update(dt){let L=K.a||K.arrowleft,R=K.d||K.arrowright;if(L)p.vx-=35*dt;if(R)p.vx+=35*dt;if(!L&&!R)p.vx*=.82;p.vx=Math.max(-7,Math.min(7,p.vx));if((K[' ']||K.w||K.arrowup)&&p.on&&!jump){p.vy=-13;p.on=0;jump=1}if(!(K[' ']||K.w||K.arrowup))jump=0;p.vy+=32*dt;p.x+=p.vx;p.y+=p.vy;p.on=0;for(const q of ps)if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h-p.vy*dt<=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.on=1}for(const o of cs)if(!o.got&&p.x<o.x+12&&p.x+p.w>o.x-12&&p.y<o.y+12&&p.y+p.h>o.y-12){o.got=1;coins++;score+=100}for(const q of powers)if(!q.got&&p.x<q.x+q.w&&p.x+p.w>q.x&&p.y<q.y+q.h&&p.y+p.h>q.y){q.got=1;powerType=q.type;powerTime=10;score+=500}if(powerTime>0)powerTime-=dt;else powerType='';if(powerType==='mushroom'){p.vx*=1.03}else if(powerType==='flower'){p.vy-=8*dt}else if(powerType==='star'){p.vx*=1.02}if(p.x+p.w>goal.x&&p.x<goal.x+45&&p.y+p.h>goal.y){next()}if(p.y>H+100)reset();cam+=(Math.max(0,Math.min(ps[ps.length-1].x+ps[ps.length-1].w-W,p.x-W*.35))-cam)*.12;document.getElementById('lv').textContent=level;document.getElementById('co').textContent=coins;document.getElementById('sc').textContent=score}
function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}draw();requestAnimationFrame(loop);
</script></body></html>
