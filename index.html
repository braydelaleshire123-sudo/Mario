<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG FLAPPY TOWER — TINY SQUARE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2c91ad;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #123;z-index:2}
#brand{position:absolute;top:12px;left:14px;font-weight:900;letter-spacing:2px}
#stats{position:absolute;top:12px;right:14px;text-align:right;font-size:13px;line-height:1.5}
#help{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#173f4acc;padding:7px 11px;border-radius:7px;font-size:12px;white-space:nowrap}
#screen{position:fixed;inset:0;display:grid;place-items:center;background:#0008;z-index:5}
.card{width:min(600px,92vw);padding:34px;text-align:center;background:linear-gradient(#eef7f4,#cfe5e3);border:4px solid #173f4c;border-radius:16px;box-shadow:0 18px 60px #0008}
h1{margin:0 0 10px;color:#173f4c;font-size:clamp(34px,7vw,60px);letter-spacing:2px}
p{color:#315663;line-height:1.5}
button{padding:13px 30px;border:3px solid #173f4c;border-radius:8px;background:#ef5d52;color:#fff;font-weight:900;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="brand">BIG FLAPPY TOWER</div>
  <div id="stats">CHECKPOINT <b id="cp">1</b><br>AIR JUMPS <b id="jumps">3</b>/3</div>
  <div id="help">A/D or ←/→ MOVE • SPACE / W / ↑ FLAP • R CHECKPOINT</div>
</div>
<div id="screen">
  <div class="card">
    <h1 id="st">BIG FLAPPY TOWER</h1>
    <p id="msg">Climb the giant tower, chain your air jumps, dodge the red pipes and hazards, and reach the top. Hit the button and rescue Pineapple!</p>
    <button id="go">START GAME</button>
  </div>
</div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}addEventListener("resize",resize);

const G={playing:false,t:0,cam:0,checkpoint:0,keys:{},sectionH:0,totalH:0,spawnGrace:0,runTime:0};
let player,platforms,hazards,boxes,checkpoints,button,pineapple,audio;

function buildWorld(){
  G.sectionH=Math.max(620,H*.98);
  const sections=24, towerL=Math.max(28,W*.045), towerR=Math.min(W-28,W*.955), tw=towerR-towerL;
  G.totalH=sections*G.sectionH;
  platforms=[];hazards=[];boxes=[];checkpoints=[];
  // Hand-authored room patterns: platforms are staggered vertically and horizontally
  // so the route reads like a sequence of deliberate jumps, not a pile of rectangles.
  // Hand-designed tower rooms. Each room is a small jump sequence with
  // intentionally separated landings; later rooms require more air-jump control.
  const rooms=[
    [[.06,70,.22],[.34,165,.18],[.64,260,.16],[.40,355,.18],[.10,450,.17],[.57,550,.16]],
    [[.64,70,.19],[.39,160,.16],[.12,250,.18],[.50,345,.16],[.73,440,.15],[.31,545,.17]],
    [[.14,68,.18],[.48,155,.17],[.72,245,.15],[.27,335,.16],[.56,430,.15],[.08,535,.17]],
    [[.72,70,.17],[.52,160,.16],[.20,250,.18],[.43,340,.15],[.76,435,.15],[.30,545,.16]],
    [[.08,70,.17],[.30,155,.14],[.62,245,.14],[.43,335,.13],[.72,430,.13],[.18,535,.14]],
    [[.72,70,.16],[.52,155,.13],[.22,245,.13],[.08,335,.12],[.48,430,.13],[.70,535,.13]]
  ];
  for(let s=0;s<sections;s++){
    const base=G.totalH-(s+1)*G.sectionH, d=s/sections, pat=rooms[s%rooms.length];
    if(s!==23) pat.forEach((a,i)=>{
      const tighten=Math.max(.58,1-d*.40);
      platforms.push({x:towerL+tw*a[0],y:base+G.sectionH-a[1],w:Math.max(46,tw*a[2]*tighten),h:18,section:s,i});
    });
    if(s<sections-1 && (s<7 || s%3===0))
      boxes.push({x:towerL+tw*(s%2?.43:.57),y:base+115,w:30,h:26,used:false,phase:s});
    if(s>0 && s%3===0)
      checkpoints.push({x:towerL+tw*(s%2?.74:.10),y:base+62,w:54,h:12,section:s});
    // Progressive hazards: first isolated bars, then combinations and moving blades.
    if(s>=3) hazards.push({type:"beam",x:towerL+tw*(s%2?.08:.45),y:base+G.sectionH-235,w:tw*.32,h:14,phase:s});
    if(s>=7) hazards.push({type:"beam",x:towerL+tw*(s%2?.48:.12),y:base+G.sectionH-425,w:tw*.25,h:12,phase:s+2});
    if(s>=9 && s%2===1) hazards.push({type:"blade",x:towerL+tw*.50,y:base+G.sectionH-325,r:20+Math.min(10,Math.floor(s/4)),phase:s});
    if(s>=12 && s%3===0) hazards.push({type:"pipe",x:towerL+tw*(s%2?.72:.18),y:base+G.sectionH-185,w:44,h:125});
    if(s>=15) hazards.push({type:"blade",x:towerL+tw*(s%2?.28:.66),y:base+G.sectionH-485,r:23,phase:s+6});
    if(s>=18){
      hazards.push({type:"beam",x:towerL+tw*.22,y:base+G.sectionH-115,w:tw*.56,h:12,phase:s+9});
      hazards.push({type:"pipe",x:towerL+tw*(s%2?.48:.48),y:base+G.sectionH-255,w:48,h:145});
    }
    if(s>=21){
      hazards.push({type:"blade",x:towerL+tw*.50,y:base+G.sectionH-175,r:28,phase:s+12});
      hazards.push({type:"beam",x:towerL+tw*.08,y:base+G.sectionH-530,w:tw*.84,h:11,phase:s+14});
    }
  }
  // Validate horizontal separation inside each room so platforms never stack into each other.
  for(let s=0;s<23;s++){
    const room=platforms.filter(p=>p.section===s).sort((a,b)=>a.y-b.y);
    for(let i=1;i<room.length;i++){
      const a=room[i-1],b=room[i];
      if(b.x<a.x+a.w+18){
        b.x=Math.min(towerR-b.w, a.x+a.w+18);
        if(b.x<towerL) b.x=towerL;
      }
    }
  }
  // Bottom starting room: deliberately safe and compact.
  const starter=[
    {x:towerL+tw*.08,y:G.totalH-70,w:tw*.28,h:18,section:23,i:100},
    {x:towerL+tw*.52,y:G.totalH-185,w:tw*.22,h:18,section:23,i:101},
    {x:towerL+tw*.28,y:G.totalH-305,w:tw*.20,h:18,section:23,i:102},
    {x:towerL+tw*.62,y:G.totalH-425,w:tw*.18,h:18,section:23,i:103}
  ];
  platforms.push(...starter);
  button={x:W/2-30,y:48,w:60,h:26,hit:false};
  pineapple={x:W/2,y:120,collected:false};
  const sp=starter[0];
  player={x:sp.x+sp.w/2-12,y:sp.y-24,w:24,h:24,vx:0,vy:0,onGround:true,airJumps:3,flapFx:0};
  G.spawnGrace=90;
  G.checkpoint=23;
  G.cam=Math.max(0,G.totalH-H);
}
function music(){
  if(audio)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audio=new AC();
    const master=audio.createGain();master.gain.value=.035;master.connect(audio.destination);
    const themes=[
      {tempo:260,mel:[392,440,494,523,494,440,392,330,392,494,523,587,523,494,440,392,330,392,440,494],bass:[98,110,123.47,130.81,123.47,110,98,82.41]},
      {tempo:220,mel:[330,392,440,494,587,494,440,392,330,294,330,392,440,494,523,494,440,392,330,392],bass:[82.41,98,110,123.47,110,98,82.41,73.42]},
      {tempo:190,mel:[523,587,659.25,698.46,659.25,587,523,440,494,523,587,659.25,698.46,783.99,698.46,659.25,587,523,494,440],bass:[130.81,146.83,164.81,174.61,164.81,146.83,130.81,110]},
      {tempo:170,mel:[659.25,587,523,494,523,587,659.25,783.99,659.25,587,523,440,494,523,587,659.25,783.99,659.25,587,523],bass:[164.81,146.83,130.81,110,130.81,146.83,164.81,196]}
    ];
    let step=0,theme=0;
    function tone(freq,dur,type,vol,when){
      const o=audio.createOscillator(),g=audio.createGain();
      o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(.0001,when);
      g.gain.exponentialRampToValueAtTime(vol,when+.018);
      g.gain.exponentialRampToValueAtTime(.0001,when+dur);
      o.connect(g);g.connect(master);o.start(when);o.stop(when+dur+.02);
    }
    function tick(){
      if(!audio||audio.state!=="running")return;
      const t=themes[theme],now=audio.currentTime+.01,i=step%t.mel.length;
      tone(t.mel[i],.24,"triangle",.16,now);
      tone(t.bass[step%t.bass.length],.42,"sine",.12,now);
      const harmony=[1.25,1.5,1.333,1.5][(Math.floor(step/5)+theme)%4];
      if(step%2===0)tone(t.mel[(i+3)%t.mel.length]*harmony,.18,"triangle",.042,now+.015);
      if(step%4===0){
        tone(t.bass[(step+1)%t.bass.length]*2,.55,"sine",.045,now);
        tone(t.mel[(i+7)%t.mel.length]/2,.30,"square",.018,now);
      }
      if(step%20===0){
        tone(t.bass[0]/2,.16,"sine",.035,now);
      }
      if(step%8===0){
        tone(82,.07,"square",.022,now);
        tone(123.47,.11,"sine",.022,now+.03);
      }
      step++;
      if(step%20===0)theme=(theme+1)%themes.length;
      setTimeout(tick,t.tempo);
    }
    tick();
  }catch(e){}
}
function start(){buildWorld();G.playing=true;G.t=0;G.runTime=0;G.spawnGrace=120;document.getElementById("screen").style.display="none";music();if(audio&&audio.state==="suspended")audio.resume()}
function checkpointRespawn(){const s=G.checkpoint;buildWorld();G.checkpoint=s;G.runTime=0;const roomPlatforms=platforms.filter(q=>q.section===s);const p=roomPlatforms[0]||platforms.find(q=>q.i===100);if(!p)return;player.x=p.x+p.w*.5-player.w*.5;player.y=p.y-player.h-2;player.vx=0;player.vy=0;player.airJumps=3;G.spawnGrace=90;G.cam=Math.max(0,Math.min(G.totalH-H,player.y-H*.58));G.playing=true;document.getElementById("screen").style.display="none"}
function die(){G.playing=false;document.getElementById("st").textContent="BACK TO CHECKPOINT";document.getElementById("msg").textContent="You hit a hazard. The tower is built from repeatable screen-sized challenge sections, so try the same section again.";document.getElementById("go").textContent="RESPAWN";document.getElementById("screen").style.display="grid"}
function win(){G.playing=false;document.getElementById("st").textContent="PINEAPPLE RESCUED!";document.getElementById("msg").textContent="You reached the top of the tower and hit the final button.";document.getElementById("go").textContent="PLAY AGAIN";document.getElementById("screen").style.display="grid"}

function jump(){
  if(!G.playing)return;
  if(player.onGround){player.vy=-12.5;player.onGround=false;player.airJumps=3;player.flapFx=10}
  else if(player.airJumps>0){player.vy=-10.8;player.airJumps--;player.flapFx=10}
}
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();G.keys[k]=true;
  if([" ","arrowup","w"].includes(k)){e.preventDefault();if(!e.repeat)jump()}
  if(k==="r"){e.preventDefault();checkpointRespawn()}
});
addEventListener("keyup",e=>G.keys[e.key.toLowerCase()]=false);
canvas.addEventListener("pointerdown",jump);
document.getElementById("go").onclick=()=>document.getElementById("go").textContent==="RESPAWN"?checkpointRespawn():start();

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(){
  if(!G.playing)return;
  G.t+=1/60;G.runTime+=1/60;
  const left=G.keys.a||G.keys.arrowleft,right=G.keys.d||G.keys.arrowright;
  player.vx+=(right-left)*.72;player.vx*=.84;player.vx=Math.max(-6,Math.min(6,player.vx));
  const oldBottom=player.y+player.h;
  player.vy+=.52;player.x+=player.vx;player.y+=player.vy;
  // Keep the opening spawn locked safely to its starter platform until the player moves.
  if(G.spawnGrace>0 && player.y>G.totalH-140 && Math.abs(player.x-(platforms.find(p=>p.i===100)?.x||0))<140){const sp=platforms.find(p=>p.i===100);if(sp){player.y=sp.y-player.h;player.vy=0;player.onGround=true;player.airJumps=3;}}
  const L=Math.max(18,W*.025),R=Math.min(W-18,W*.975);
  player.x=Math.max(L,Math.min(R-player.w,player.x));
  if(player.flapFx>0)player.flapFx--;
  player.onGround=false;
  for(const p of platforms){
    if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&oldBottom<=p.y&&player.y+player.h>=p.y){
      player.y=p.y-player.h;player.vy=0;player.onGround=true;player.airJumps=3;break;
    }
  }
  // Wall jump, but keep it snappy instead of floaty.
  if(!player.onGround&&(player.x<=L+1||player.x+player.w>=R-1)&&player.vy>0&&(left||right)){player.vy=-9.5;player.vx=right?-6:6}
  for(const b of boxes){
    const by=b.y+Math.sin(G.t*2+b.phase)*7;
    const box={x:b.x,y:by,w:b.w,h:b.h};
    if(!b.used&&overlap(player,box)){b.used=true;player.airJumps=3;player.vy=-9}
  }
  if(G.spawnGrace>0)G.spawnGrace--;
  for(const h of hazards){
    if(G.spawnGrace<=0){
      if(h.type==="beam"&&overlap(player,{x:h.x,y:h.y,w:h.w,h:h.h})){die();return}
      if(h.type==="pipe"&&overlap(player,{x:h.x,y:h.y,w:h.w,h:h.h})){die();return}
      if(h.type==="blade"){const sy=h.y+Math.sin(G.t*2+h.phase)*24;if(Math.hypot(player.x+10-h.x,player.y+10-sy)<h.r+9){die();return}}
    }
  }
  for(const c of checkpoints){
    if(player.y<c.y+35&&player.y>c.y-40&&player.x+player.w>c.x&&player.x<c.x+c.w)G.checkpoint=Math.min(G.checkpoint,c.section);
  }
  // The finish is deliberately gated: reaching the top section alone cannot
  // instantly end the run. The player must climb far enough to activate the
  // late checkpoint, then physically hit the final button and pineapple.
  if(player.y<G.sectionH*1.05 && G.checkpoint<=3){
    if(overlap(player,button)){button.hit=true}
    if(button.hit&&overlap(player,pineappleBox())){pineapple.collected=true;win();return}
  }
  if(player.y>G.totalH+150 && G.spawnGrace<=0){checkpointRespawn();return}
  const target=H*.55;
  G.cam=player.y-target;
  G.cam=Math.max(0,Math.min(G.totalH-H,G.cam));
  document.getElementById("cp").textContent=24-G.checkpoint;
  document.getElementById("jumps").textContent=player.airJumps;
}
function pineappleBox(){return{x:pineapple.x-20,y:pineapple.y-25,w:40,h:55}}

function draw(){
  const L=Math.max(18,W*.025),R=Math.min(W-18,W*.975),tw=R-L;
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#74d4e3");bg.addColorStop(.55,"#4aaec2");bg.addColorStop(1,"#318fa8");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // Wide, bright tower chamber with subtle depth.
  const chamber=ctx.createLinearGradient(L,0,R,0);chamber.addColorStop(0,"#52b9c9");chamber.addColorStop(.5,"#67c5d1");chamber.addColorStop(1,"#4daabd");ctx.fillStyle=chamber;ctx.fillRect(L,0,R-L,H);
  ctx.strokeStyle="#ffffff20";ctx.lineWidth=2;
  for(let x=L+45;x<R;x+=90){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  // Decorative horizontal screen seams.
  for(let y=-(G.cam%G.sectionH);y<H+G.sectionH;y+=G.sectionH){ctx.fillStyle="#ffffff28";ctx.fillRect(L,y,R-L,4)}
  // chunky tower walls
  ctx.fillStyle="#e6c85d";ctx.fillRect(L-18,0,18,H);ctx.fillRect(R,0,18,H);
  ctx.fillStyle="#6d985c";ctx.fillRect(L-10,0,10,H);ctx.fillRect(R,0,10,H);
  for(let y=-(G.cam%30);y<H+30;y+=30){ctx.fillStyle="#8ab56b";ctx.fillRect(L-15,y,10,11);ctx.fillRect(R+5,y,10,11)}
  // small bolts on the tower walls
  ctx.fillStyle="#f7df83";for(let y=18;y<H;y+=52){ctx.beginPath();ctx.arc(L-9,y,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(R+9,y+20,2,0,Math.PI*2);ctx.fill()}
  // Dark-blue industrial blocks, matching the chunky maze-like reference style.
  const blockY=((G.totalH-G.cam)%G.sectionH)-G.sectionH;
  for(let yy=blockY;yy<H+G.sectionH;yy+=G.sectionH){
    ctx.fillStyle="#315b7c";
    ctx.fillRect(L+tw*.08,yy+90,tw*.22,28);
    ctx.fillRect(L+tw*.55,yy+250,tw*.28,28);
    ctx.fillStyle="#214b6d";
    ctx.fillRect(L+tw*.08,yy+90,tw*.22,6);
    ctx.fillRect(L+tw*.55,yy+250,tw*.28,6);
  }
  // screen boundary
  const section=Math.max(0,Math.min(23,Math.floor(player.y/G.sectionH)));
  const climb=Math.max(0,Math.min(23,23-section));
  ctx.fillStyle="#ffffff18";ctx.fillRect(L+1,H*.02,R-L-2,3);
  ctx.fillStyle="#173f4ccc";ctx.font="bold 11px Arial";ctx.fillText("TOWER "+(climb+1)+" / 24",L+12,28);

  for(const p of platforms){
    const y=p.y-G.cam;if(y<-35||y>H+35)continue;
    ctx.fillStyle="#4f754d";ctx.fillRect(p.x-3,y-2,p.w+6,p.h+5);
    ctx.fillStyle="#d9b94f";ctx.fillRect(p.x,y,p.w,p.h);
    ctx.fillStyle="#f1d36a";ctx.fillRect(p.x+3,y+3,p.w-6,5);
    ctx.strokeStyle="#47744d";ctx.lineWidth=3;ctx.strokeRect(p.x,y,p.w,p.h);
  }
  for(const h of hazards){
    if(h.type==="beam"){
      const y=h.y-G.cam;ctx.fillStyle="#e4544d";ctx.fillRect(h.x,y,h.w,h.h);
      ctx.fillStyle="#ff8072";ctx.fillRect(h.x,y,h.w,4);
      ctx.fillStyle="#b73f3d";ctx.fillRect(h.x,y+h.h,h.w,6);
    }else if(h.type==="pipe"){
      const y=h.y-G.cam;
      // Chunky RED PIPE: shaft, thick collar, top lip, inner opening and highlights.
      ctx.fillStyle="#8e2f32";ctx.fillRect(h.x,y,h.w,h.h);
      ctx.fillStyle="#d94a4b";ctx.fillRect(h.x+5,y,h.w-10,h.h);
      ctx.fillStyle="#f47b68";ctx.fillRect(h.x+7,y+2,5,h.h-4);
      ctx.fillStyle="#b73539";ctx.fillRect(h.x-9,y-11,h.w+18,17);
      ctx.fillStyle="#ef5b55";ctx.fillRect(h.x-9,y-11,h.w+18,6);
      ctx.fillStyle="#76272d";ctx.fillRect(h.x-6,y-3,h.w+12,7);
      ctx.fillStyle="#421e28";ctx.beginPath();ctx.ellipse(h.x+h.w/2,y-1,(h.w+4)/2,5,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#ff9a82";ctx.lineWidth=2;ctx.strokeRect(h.x-9,y-11,h.w+18,17);
      ctx.fillStyle="#e85a55";ctx.fillRect(h.x+h.w-7,y+18,4,Math.max(10,h.h-25));
    }else{
      const y=h.y-G.cam+Math.sin(G.t*2+h.phase)*24;ctx.save();ctx.translate(h.x,y);ctx.rotate(G.t*5);ctx.fillStyle="#dce8e8";ctx.strokeStyle="#52717a";ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8,r=i%2?h.r:h.r*.42;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    }
  }
  // Checkpoints
  for(const c of checkpoints){const y=c.y-G.cam;ctx.fillStyle=c.section<=G.checkpoint?"#59d27a":"#a8b8b4";ctx.fillRect(c.x,y,c.w,12);ctx.fillStyle="#e9f5e9";ctx.font="bold 10px Arial";ctx.fillText("CP",c.x+16,y-4)}
  // Floating refill boxes
  for(const b of boxes)if(!b.used){const y=b.y-G.cam+Math.sin(G.t*2+b.phase)*7;ctx.fillStyle="#d9a83e";ctx.fillRect(b.x,y,b.w,b.h);ctx.strokeStyle="#71572a";ctx.lineWidth=3;ctx.strokeRect(b.x,y,b.w,b.h);ctx.fillStyle="#fff2b1";ctx.font="bold 18px Arial";ctx.fillText("↑",b.x+8,y+20)}
  // Final red button + pineapple
  const nearTop=player.y<G.sectionH*1.05;
  if(nearTop && G.checkpoint<=3){
    const by=button.y-G.cam;ctx.fillStyle="#b63d39";ctx.fillRect(button.x-8,by+button.h,button.w+16,8);ctx.fillStyle=button.hit?"#75e26f":"#ef5d52";ctx.fillRect(button.x,by,button.w,button.h);ctx.strokeStyle="#7d302f";ctx.lineWidth=3;ctx.strokeRect(button.x,by,button.w,button.h);
  }
  if(nearTop&&!pineapple.collected){const py=pineapple.y-G.cam;ctx.save();ctx.translate(pineapple.x,py);ctx.fillStyle="#e7b938";ctx.beginPath();ctx.ellipse(0,8,13,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#59a64f";ctx.beginPath();ctx.moveTo(-10,-8);ctx.lineTo(-5,-24);ctx.lineTo(0,-10);ctx.lineTo(6,-24);ctx.lineTo(10,-8);ctx.fill();ctx.restore()}
  // Flappy: green Tiny Square with three white feathers above it.
  const px=player.x+12,py=player.y-G.cam+12;
  ctx.save();ctx.translate(px,py);
  const flap=Math.sin(G.t*18)*2;
  ctx.fillStyle="#63d4a1";ctx.fillRect(-10,-10,20,20);
  ctx.strokeStyle="#2e765a";ctx.lineWidth=3;ctx.strokeRect(-10,-10,20,20);
  ctx.fillStyle="#7ce1b4";ctx.fillRect(-7,-7,14,5);
  ctx.fillStyle="#f7f7e9";
  ctx.save();ctx.rotate(-.12+flap*.015);ctx.fillRect(-7,-19,5,9);ctx.restore();
  ctx.save();ctx.rotate(.02-flap*.01);ctx.fillRect(-1,-22,5,12);ctx.restore();
  ctx.save();ctx.rotate(.12-flap*.015);ctx.fillRect(5,-19,5,9);ctx.restore();
  if(player.flapFx>0){ctx.strokeStyle="#d8fff0";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-16,7);ctx.lineTo(-23,10);ctx.moveTo(16,7);ctx.lineTo(23,10);ctx.stroke();}
    ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop)}
resize();buildWorld();requestAnimationFrame(loop);
