{platforms:[{x:0,y:560,w:1000,h:120},{x:1150,y:500,w:700,h:180},{x:2000,y:560,w:600,h:120},{x:2750,y:420,w:700,h:260},{x:3600,y:560,w:900,h:120},{x:4700,y:480,w:650,h:200},{x:5550,y:560,w:900,h:120},{x:6650,y:400,w:800,h:280},{x:7650,y:560,w:1300,h:120}],blocks:[],enemies:[],goal:{x:8850,y:455,w:26,h:105}},
{platforms:[{x:0,y:560,w:900,h:120},{x:1050,y:460,w:650,h:220},{x:1850,y:560,w:750,h:120},{x:2750,y:450,w:750,h:230},{x:3650,y:560,w:900,h:120},{x:4750,y:430,w:700,h:250},{x:5650,y:560,w:900,h:120},{x:6750,y:440,w:800,h:240},{x:7750,y:560,w:1400,h:120}],blocks:[],enemies:[],goal:{x:8900,y:455,w:26,h:105}}
];

let cam=0,coinsGot=0,lives=3,score=0,ended=false,last=performance.now(),shake=0;
let activePlatforms=platforms,activeBlocks=blocks,activeEnemies=enemies,activeGoal=goal;
const particles=[];
function spawn(x,y,n,color){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,life:.4+Math.random()*.5,color,s:2+Math.random()*4})}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function resetPlayer(){player.x=120;player.y=300;player.vx=0;player.vy=0;player.ground=false;player.inv=1.5;cam=0}
function startLevel2(){
 level++; if(level>9){end('GAME COMPLETE!','You finished all 9 levels! Score: '+score);return;}
 document.getElementById('help').textContent='LEVEL '+level+' — reach the FINISH flag! • A/D or ←/→ to move • Space/W/↑ to jump';
 const d=levelData[level-2]; world=worlds[level-1]; activePlatforms=d.platforms;activeBlocks=d.blocks;activeEnemies=d.enemies;activeGoal=d.goal;
 coinsGot=0;coins.length=0;powerups.length=0;levelPower=(level-1)%5;
 activeBlocks.forEach(b=>b.used=false);activeEnemies.forEach(e=>e.alive=true);
 for(let i=0;i<14;i++)coins.push({x:180+i*55,y:470,got:false,t:Math.random()*6.28});
 player.x=120;player.y=300;player.vx=0;player.vy=0;player.ground=false;player.inv=2;cam=0;
}
function hurt(){if(player.inv>0)return;lives--;shake=12;spawn(player.x+player.w/2,player.y+player.h/2,18,'#ff6b6b');if(lives<=0){end('GAME OVER','You scored '+score+' points.')}else resetPlayer()}
function end(t,s){ended=true;document.getElementById('title').textContent=t;document.getElementById('subtitle').textContent=s;document.getElementById('screen').style.display='grid'}
function restart(){level=1;powerType='';world=worlds[0];activePlatforms=platforms;activeBlocks=blocks;activeEnemies=enemies;activeGoal=goal;coins.forEach(o=>o.got=false);blocks.forEach(b=>b.used=false);level2Blocks.forEach(b=>b.used=false);powerups.length=0;powerType='';enemies.forEach(e=>e.alive=true);level2Enemies.forEach(e=>e.alive=true);coinsGot=0;lives=3;score=0;ended=false;player.inv=0;player.power=0;resetPlayer();document.getElementById('screen').style.display='none'}
document.getElementById('restart').onclick=restart;

function solidCollision(prevX,prevY){
 const solids=activePlatforms.concat(activeBlocks);
 player.ground=false;

 // Reliable collision for platforms and mystery boxes.
 if(player.vy>=0){
  for(const p of solids){
   const horizontal=player.x+player.w>p.x&&player.x<p.x+p.w;
   const crossed=prevY+player.h<=p.y&&player.y+player.h>=p.y;
   if(horizontal&&crossed){
    player.y=p.y-player.h;
    player.vy=0;
    player.ground=true;
    break;
   }
  }
 }else{
  for(const p of solids){
   const horizontal=player.x+player.w>p.x&&player.x<p.x+p.w;
   const crossed=prevY>=p.y+p.h&&player.y<=p.y+p.h;
   if(horizontal&&crossed){
    player.y=p.y+p.h;
    player.vy=0;
    if(activeBlocks.includes(p) && !p.used){
     p.used=true;
     powerups.push({x:p.x+p.w/2-14,y:p.y-28,w:28,h:28,vy:-7,life:12,type:['speed','shield','jump','coin','star'][levelPower]});
     score+=100;
     spawn(p.x+p.w/2,p.y,12,'#ffd54a');
    }
    break;
   }
  }
 }
}
function update(dt){
 if(ended)return;
 dt=Math.min(dt,0.033);
 if(player.inv>0)player.inv-=dt;
 if(player.power>0)player.power-=dt;
 if(player.power<=0)powerType='';
 const left=keys['arrowleft']||keys['a'],right=keys['arrowright']||keys['d'];
 const boosted=player.power>0&&powerType==='speed';
 const accel=player.ground?(boosted?64:48):34, max=boosted?11:7.5;
 if(player.power>0&&powerType==='jump'&&jumpPressed)player.vy=-17;
 if(left){player.vx-=accel*dt;player.face=-1} if(right){player.vx+=accel*dt;player.face=1}
 if(!left&&!right){const drag=player.ground?12:3;player.vx-=Math.sign(player.vx)*Math.min(Math.abs(player.vx),drag*dt)}
 player.vx=Math.max(-max,Math.min(max,player.vx));
 if(player.ground)player.coyote=.11;else player.coyote=Math.max(0,player.coyote-dt);
 if(jumpPressed)player.jumpBuffer=.12;else player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);
 jumpPressed=false;
 if(player.jumpBuffer>0&&player.coyote>0){player.vy=-13.8;player.ground=false;player.coyote=0;player.jumpBuffer=0;spawn(player.x+player.w/2,player.y+player.h,8,'#d8e6ee')}
 if(!(keys[' ']||keys['w']||keys['arrowup'])&&player.vy<-5)player.vy+=22*dt;
 player.vy+=36*dt;player.vy=Math.min(player.vy,20);
 const prevX=player.x,prevY=player.y;
 player.x+=player.vx;player.y+=player.vy;
 if(player.x<0)player.x=0;
 solidCollision(prevX,prevY);
 if(player.ground&&Math.abs(player.vx)>1)player.run+=dt*12;else player.run+=dt*4;
 for(const o of coins)if(!o.got){o.t+=dt*5;const box={x:o.x-11,y:o.y-11,w:22,h:22};if(overlap(player,box)){o.got=true;coinsGot++;score+=100+(powerType==='coin'&&player.power>0?100:0);spawn(o.x,o.y,10,'#ffd54a')}}
 for(let i=powerups.length-1;i>=0;i--){
  const p=powerups[i];
  p.vy+=24*dt;p.y+=p.vy*dt;
  // Keep the power-up sitting on the top of the box/platform until collected.
  for(const s of activePlatforms.concat(activeBlocks)){
   if(p.x+p.w>s.x&&p.x<s.x+s.w&&p.y+p.h>=s.y&&p.y+p.h-p.vy*dt<=s.y){
    p.y=s.y-p.h;p.vy=0;
   }
  }
  if(overlap(player,p)){
   player.power=10;
   powerType=p.type;
   if(p.type==='shield'||p.type==='star') player.inv=10;
   score+=500;
   spawn(p.x+p.w/2,p.y+p.h/2,20,'#7df9ff');
   powerups.splice(i,1);
  }else{
   p.life-=dt;
   if(p.life<=0)powerups.splice(i,1);
  }
 }
 for(const e of activeEnemies)if(e.alive){e.x+=e.vx;if(e.x<e.min||e.x>e.max)e.vx*=-1;const box={x:e.x,y:e.y,w:e.w,h:e.h};if(overlap(player,box)){const stomp=player.vy>0&&player.y+player.h-player.vy<=e.y+12;if(stomp){e.alive=false;player.vy=-9;score+=250;spawn(e.x+20,e.y+20,16,'#b48cff')}else hurt()}}
 if(player.y>H+180){
  // Falling off a platform should not send the player all the way back to the start.
  // Put them back on the nearest platform instead.
  let nearest=null,best=Infinity;
  for(const p of activePlatforms){
   if(player.x+player.w>p.x&&player.x<p.x+p.w){
    const d=Math.abs(player.x-(p.x+p.w/2));
    if(d<best){best=d;nearest=p}
   }
  }
  if(nearest){
   player.y=nearest.y-player.h;
   player.vy=0;
   player.ground=true;
   player.inv=1.5;
  }else{
   resetPlayer();
  }
 }
 if(overlap(player,activeGoal)){
  if(level<9){startLevel2();}else{end('GAME COMPLETE!','You finished all 9 levels! Coins: '+coinsGot+'  •  Score: '+score);}
}
 const target=player.x-W*.35;cam+=(Math.max(0,Math.min(world.w-W,target))-cam)*Math.min(1,dt*7);
 shake=Math.max(0,shake-dt*30);
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=12*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 document.getElementById('levelNum').textContent=level;document.getElementById('coins').textContent=coinsGot;document.getElementById('lives').textContent=lives;document.getElementById('score').textContent=score;
}
function cloud(x,y,s){ctx.fillStyle='#ffffffb8';ctx.fillRect(x-20*s,y-12*s,105*s,24*s);ctx.fillRect(x+5*s,y-25*s,45*s,13*s)}
function drawBG(){
 const sky=['#ff7a18','#d43b00','#7a1200','#ffb000','#5a0a00','#ff4b00','#8f1d00','#ff6a00','#6b1400'][(level-1)%9];
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // Pixel-fire sky: layered block clouds, smoke, sparks, and a huge blocky sun.
 ctx.fillStyle='#ffdf3b';ctx.fillRect(W-150,55,80,80);
 ctx.fillStyle='#ff9d00';ctx.fillRect(W-170,75,20,40);ctx.fillRect(W-70,75,20,40);ctx.fillRect(W-130,35,40,20);
 // distant black-red mountains
 for(let layer=0;layer<3;layer++){
  ctx.fillStyle=layer===0?'#7d1800':layer===1?'#4b0d00':'#250600';
  for(let i=0;i<18;i++){
   let x=Math.floor(i*520-cam*(.08+layer*.12));
   let base=H*.70+layer*35;
   ctx.fillRect(x,base-100-layer*20,280,100+layer*20);
   ctx.fillRect(x+55,base-145-layer*25,170,45);
   ctx.fillRect(x+105,base-175-layer*20,75,30);
  }
 }
 // giant pixel fire clouds
 for(let i=0;i<16;i++){
  let x=Math.floor(i*430-cam*.18), y=105+(i%4)*55;
  ctx.fillStyle=i%2?'#ffcf33':'#ff5a00';
  ctx.fillRect(x,y+18,120,34);
  ctx.fillRect(x+20,y,55,25);
  ctx.fillRect(x+70,y+8,45,42);
  ctx.fillStyle='#ffea66';
  ctx.fillRect(x+34,y+8,20,12);
 }
 // floating embers
 ctx.fillStyle='#ffe66d';
 for(let i=0;i<45;i++){
  let x=(i*151-cam*.35)%W;if(x<0)x+=W;
  let y=35+(i*67)%360;
  let sz=(i%3===0)?6:4;
  ctx.fillRect(Math.floor(x/4)*4,Math.floor(y/4)*4,sz,sz);
 }
 // foreground flame silhouettes
 ctx.fillStyle='#160300';
 for(let i=0;i<24;i++){
  let x=Math.floor(i*180-cam*.5),base=H*.88;
  ctx.fillRect(x,base-40,95,40);
  ctx.fillRect(x+18,base-70,50,30);
  ctx.fillRect(x+32,base-92,22,22);
 }
 // pixel fire strips near the ground
 ctx.fillStyle='#ff9d00';
 for(let i=0;i<30;i++){
  let x=i*120-cam*.45,y=H*.83;
  ctx.fillRect(x,y,70,10);ctx.fillRect(x+15,y-12,35,12);
 }
}
function platform(p){
 const x=p.x-cam;if(x+p.w<0||x>W)return;
 ctx.fillStyle='#9b5428';ctx.fillRect(x,p.y,p.w,H-p.y+220);
 ctx.fillStyle='#55b84a';ctx.fillRect(x,p.y,p.w,16);
 ctx.fillStyle='#8be35a';for(let i=0;i<p.w;i+=30)ctx.fillRect(x+i,p.y+16,16,4);
 ctx.fillStyle='#7a3f22';for(let i=10;i<p.w;i+=42){ctx.fillRect(x+i,p.y+45,8,8);ctx.fillRect(x+i+18,p.y+105,10,10);ctx.fillRect(x+i+3,p.y+175,8,8);}
}
function block(b){
 const x=b.x-cam;ctx.fillStyle=b.used?'#8a632f':'#d98d2b';ctx.fillRect(x,b.y,b.w,b.h);ctx.strokeStyle='#7b4b1a';ctx.lineWidth=3;ctx.strokeRect(x+1,b.y+1,b.w-2,b.h-2);
 ctx.fillStyle=b.used?'#b08a55':'#ffd77a';ctx.fillRect(x+7,b.y+7,b.w-14,5);ctx.font='bold 27px Arial';ctx.textAlign='center';ctx.fillStyle=b.used?'#d8c7ad':'#fff2a9';ctx.fillText(b.used?'!':'?',x+b.w/2,b.y+37);
}
function powerup(p){const x=Math.floor(p.x-cam),y=Math.floor(p.y);ctx.fillStyle={speed:'#ff8c00',shield:'#55ddff',jump:'#9966ff',coin:'#ffcc00',star:'#ff6699'}[p.type]||'#fff';ctx.fillRect(x,y,p.w,p.h);ctx.fillStyle='#000';ctx.fillRect(x+4,y+4,p.w-8,p.h-8);ctx.fillStyle='#fff';ctx.font='bold 16px Courier New';ctx.textAlign='center';ctx.fillText({speed:'S',shield:'O',jump:'J',coin:'C',star:'*'}[p.type]||'?',x+p.w/2,y+20);}
function drawGoal(){const x=Math.floor(activeGoal.x-cam);ctx.fillStyle='#fff';ctx.font='bold 16px Courier New';ctx.textAlign='left';ctx.fillText('FINISH',x-8,activeGoal.y-16);ctx.fillStyle='#eeeeee';ctx.fillRect(x,activeGoal.y,8,105);ctx.fillStyle='#ff3355';ctx.fillRect(x+8,activeGoal.y,48,8);ctx.fillRect(x+8,activeGoal.y+8,40,8);ctx.fillRect(x+8,activeGoal.y+16,32,8);ctx.fillStyle='#ffcc00';ctx.fillRect(x-4,activeGoal.y-4,8,8);}
function coin(o){
 const x=Math.floor(o.x-cam),y=Math.floor(o.y+Math.sin(o.t)*3);
 ctx.fillStyle='#ffd83d';ctx.fillRect(x-9,y-12,18,24);ctx.fillStyle='#fff08a';ctx.fillRect(x-4,y-8,5,16);ctx.fillStyle='#b77a00';ctx.fillRect(x+5,y-7,4,14);
}
function enemy(e){
 const x=Math.floor(e.x-cam),y=Math.floor(e.y);
 ctx.fillStyle='#6b2b1f';ctx.fillRect(x+4,y+8,32,28);ctx.fillStyle='#9b4430';ctx.fillRect(x+8,y+2,24,10);
 ctx.fillStyle='#fff';ctx.fillRect(x+8,y+14,7,7);ctx.fillRect(x+25,y+14,7,7);ctx.fillStyle='#000';ctx.fillRect(x+10,y+16,4,5);ctx.fillRect(x+27,y+16,4,5);
 ctx.fillStyle='#35120d';ctx.fillRect(x,y+36,16,6);ctx.fillRect(x+24,y+36,16,6);
}
function playerDraw(){
 const x=Math.floor(player.x-cam),y=Math.floor(player.y),flip=player.face<0;
 ctx.save();
 if(flip){ctx.translate(x+player.w,y);ctx.scale(-1,1);}else ctx.translate(x,y);
 if(player.inv>0&&Math.floor(player.inv*12)%2===0)ctx.globalAlpha=.55;
 const step=Math.floor(player.run)%2;
 ctx.fillStyle='#5b2b16';ctx.fillRect(7,39,9,13);ctx.fillRect(23,39,9,13);
 if(step){ctx.fillRect(5,48,12,4);ctx.fillRect(22,46,12,6);}else{ctx.fillRect(6,47,11,5);ctx.fillRect(23,48,11,4);}
 ctx.fillStyle='#2f6fe4';ctx.fillRect(5,25,26,16);ctx.fillStyle='#173b9c';ctx.fillRect(5,36,26,5);
 ctx.fillStyle='#f0b27a';ctx.fillRect(9,11,21,16);ctx.fillRect(25,18,8,8);ctx.fillStyle='#5b2b16';ctx.fillRect(7,7,23,8);ctx.fillRect(12,3,18,6);ctx.fillRect(28,12,5,9);
 ctx.fillStyle='#222';ctx.fillRect(25,14,4,5);
 ctx.fillStyle='#e33b2f';ctx.fillRect(5,0,29,8);ctx.fillRect(11,-4,18,5);ctx.fillStyle='#fff';ctx.fillRect(26,5,9,4);
 if(player.power>0){ctx.fillStyle=powerType==='shield'||powerType==='star'?'#7df9ff':'#fff';ctx.fillRect(2,-5,4,62);ctx.fillRect(30,-5,4,62);}
 ctx.restore();
}
function render(){
 drawBG();
 const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.save();ctx.translate(sx,sy);
 for(const p of activePlatforms)platform(p);
 for(const b of activeBlocks)block(b);
 for(const o of coins)if(!o.got&&o.x-cam>-30&&o.x-cam<W+30)coin(o);
 for(const e of activeEnemies)if(e.alive)enemy(e);
 for(const p of powerups)powerup(p);
 drawGoal();playerDraw();
 for(const p of particles){ctx.globalAlpha=1;ctx.fillStyle=p.color;ctx.fillRect(Math.floor(p.x-cam),Math.floor(p.y),Math.ceil(p.s),Math.ceil(p.s))}
 ctx.restore();
}
function loop(t){const dt=(t-last)/1000;last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
