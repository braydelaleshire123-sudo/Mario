<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG FLAPPY TOWER — TINY SQUARE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;image-rendering:auto}
#hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 5px #000;z-index:2}
#title{position:absolute;top:12px;left:16px;font-weight:900;letter-spacing:2px}
#stats{position:absolute;top:12px;right:16px;text-align:right;font-size:14px;line-height:1.5}
#jumps{color:#7ff0ff}
#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:8px;background:#000b;font-size:12px;white-space:nowrap}
#screen{position:fixed;inset:0;display:grid;place-items:center;background:#000b;z-index:5}
.card{width:min(620px,92vw);padding:34px;text-align:center;background:#101a22f5;border:1px solid #ffffff35;border-radius:16px;box-shadow:0 25px 90px #000}
h1{margin:0 0 10px;font-size:clamp(30px,7vw,58px);letter-spacing:3px}p{color:#b8c4cb;line-height:1.55}
button{padding:14px 30px;border:1px solid #ffffff55;border-radius:9px;background:#235365;color:#fff;font-weight:900;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="title">BIG FLAPPY TOWER</div>
  <div id="stats">SECTION <b id="section">1</b><br>FLAPPY JUMPS <b id="jumps">3</b>/3</div>
  <div id="help">A/D or ←/→ MOVE • SPACE / W / ↑ JUMP • R RESPAWN</div>
</div>
<div id="screen">
  <div class="card">
    <h1 id="screenTitle">BIG FLAPPY TOWER</h1>
    <p id="screenText">Climb the giant tower, use your three air-jumps, hit checkpoints, dodge pipes, lava and blades, and rescue Pineapple at the top.</p>
    <button id="start">START GAME</button>
  </div>
</div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();

const S={playing:false,t:0,cam:0,keys:{},checkpoint:0};
let player,levels,boxes,flappys,hazards,pineapple,audio;

function makeWorld(){
  levels=[];boxes=[];flappys=[];hazards=[];
  const towerL=Math.max(20,W*.08), towerR=Math.min(W-20,W*.92), tw=towerR-towerL;
  const sectionH=H*.92;
  // Each section has several large, clearly visible platforms.
  for(let s=0;s<13;s++){
    const base=s*sectionH;
    const p=[
      {x:towerL+tw*.08,y:base+sectionH-55,w:tw*.28,h:18},
      {x:towerL+tw*.48,y:base+sectionH-180,w:tw*.25,h:18},
      {x:towerL+tw*.18,y:base+sectionH-315,w:tw*.25,h:18},
      {x:towerL+tw*.58,y:base+sectionH-450,w:tw*.27,h:18},
      {x:towerL+tw*.30,y:base+sectionH-585,w:tw*.24,h:18},
      {x:towerL+tw*.68,y:base+sectionH-720,w:tw*.20,h:18}
    ];
    p.forEach((q,i)=>levels.push({...q,section:s,kind:i===1&&s%2===0?"moving":"solid",homeX:q.x,range:tw*.16,speed:.7+s*.035,phase:s+i}));
    if(s<12){
      boxes.push({x:towerL+tw*(s%2?.24:.62),y:base+sectionH-375,w:30,h:30,bob:s,used:false});
    }
    // Flappy pickups are visible in the first few sections; collecting one grants/refills the 3 air jumps.
    if(s===1||s===5||s===9) flappys.push({x:towerL+tw*.5,y:base+sectionH-525,r:15,collected:false});
    // Checkpoint at the top of each section.
    if(s>0) levels.push({x:towerL+tw*.82,y:base+35,w:tw*.10,h:18,section:s,kind:"checkpoint",homeX:towerL+tw*.82});
    // Hazards.
    hazards.push({type:"lava",x:towerL+tw*.37,y:base+sectionH-35,w:tw*.42,h:35});
    hazards.push({type:"blade",x:towerL+tw*.43,y:base+sectionH-245,r:18,phase:s*.9});
    if(s%2===0) hazards.push({type:"pipe",x:towerL+tw*.08,y:base+sectionH-510,w:42,h:95});
  }
  pineapple={x:W/2,y:12*sectionH+45,collected:false};
  player={x:towerL+tw*.16,y:12,w:18,h:18,vx:0,vy:0,onGround:false,airJumps:3};
  S.checkpoint=0;S.cam=0;
}

function startMusic(){
  if(audio)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    audio=new AC(); const gain=audio.createGain();gain.gain.value=.045;gain.connect(audio.destination);
    const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23]; let n=0;
    setInterval(()=>{if(!audio||audio.state!=="running")return;const o=audio.createOscillator();o.type="triangle";o.frequency.value=notes[n++%notes.length];const g=audio.createGain();g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.8,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.25);o.connect(g);g.connect(gain);o.start();o.stop(audio.currentTime+.27)},320);
  }catch(e){}
}
function reset(){
  makeWorld();S.playing=true;S.t=0;
  document.getElementById("screen").style.display="none";
  startMusic(); if(audio&&audio.state==="suspended")audio.resume();
}
function die(){S.playing=false;document.getElementById("screenTitle").textContent="CHECKPOINT!";document.getElementById("screenText").textContent="You hit a hazard. Respawn at the last checkpoint and try the section again.";document.getElementById("start").textContent="RESPAWN";document.getElementById("screen").style.display="grid"}
function respawn(){
  const sec=S.checkpoint, sectionH=H*.92, towerL=Math.max(20,W*.08),tw=Math.min(W-20,W*.92)-towerL;
  player.x=towerL+tw*(sec%2?.52:.12);player.y=sec*sectionH+sectionH-205;player.vx=0;player.vy=0;player.airJumps=3;S.cam=Math.max(0,player.y-H*.48);S.playing=true;
  document.getElementById("screen").style.display="none";
}
function win(){S.playing=false;document.getElementById("screenTitle").textContent="PINEAPPLE RESCUED!";document.getElementById("screenText").textContent="You made it to the top of the giant tower.";document.getElementById("start").textContent="PLAY AGAIN";document.getElementById("screen").style.display="grid"}

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();S.keys[k]=true;
  if([" ","arrowup","w"].includes(k)){e.preventDefault();if(!e.repeat)jump()}
  if(k==="r"){e.preventDefault();respawn()}
});
addEventListener("keyup",e=>S.keys[e.key.toLowerCase()]=false);
canvas.addEventListener("pointerdown",()=>jump());
document.getElementById("start").onclick=()=>{if(S.checkpoint>0&&document.getElementById("start").textContent==="RESPAWN")respawn();else reset()};

function jump(){
  if(!S.playing)return;
  if(player.onGround){player.vy=-13.2;player.onGround=false;player.airJumps=3}
  else if(player.airJumps>0){player.vy=-11.8;player.airJumps--}
}
function rectHit(a,b){return a.x<a.x+a.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(){
  if(!S.playing)return; S.t+=1/60;
  const left=S.keys.a||S.keys.arrowleft,right=S.keys.d||S.keys.arrowright;
  player.vx+=(right-left)*.75;player.vx*=.86;player.vx=Math.max(-6,Math.min(6,player.vx));
  const oldBottom=player.y+player.h;player.vy+=.55;player.x+=player.vx;player.y+=player.vy;
  const towerL=Math.max(20,W*.08),towerR=Math.min(W-20,W*.92);
  player.x=Math.max(towerL,Math.min(towerR-player.w,player.x));player.onGround=false;
  // wall jump
  if((player.x<=towerL+1||player.x+player.w>=towerR-1)&&player.vy>0){if((left||right)&&!player.onGround){player.vy=-9.5;player.vx=right?-6:6}}
  for(const p of levels){
    let px=p.x;
    if(p.kind==="moving")px=p.homeX+Math.sin(S.t*p.speed+p.phase)*p.range;
    if(player.vy>=0&&player.x+player.w>px&&player.x<px+p.w&&oldBottom<=p.y&&player.y+player.h>=p.y){
      player.y=p.y-player.h;player.vy=0;player.onGround=true;player.airJumps=3;
      if(p.kind==="checkpoint"&&S.checkpoint<p.section)S.checkpoint=p.section;
      break;
    }
  }
  // floating boxes refill air jumps
  for(const b of boxes){const by=b.y+Math.sin(S.t*2+b.bob)*7;if(!b.used&&player.x+player.w>b.x&&player.x<b.x+b.w&&player.y+player.h>by&&player.y<by+b.h&&player.vy>0){b.used=true;player.airJumps=3;player.vy=-10}}
  for(const h of hazards){
    if(h.type==="lava"&&rectHit(player,h)){die();return}
    if(h.type==="pipe"){const y=h.y;const a={x:h.x,y:y,w:h.w,h:h.h};if(rectHit(player,a)){die();return}}
    if(h.type==="blade"){const sy=h.y+Math.sin(S.t*2+h.phase)*24;if(Math.hypot(player.x+9-h.x,player.y+9-sy)<h.r+9){die();return}}
  }
  for(const f of flappys)if(!f.collected&&Math.hypot(player.x+9-f.x,player.y+9-f.y)<28){f.collected=true;player.airJumps=3}
  if(Math.hypot(player.x+9-pineapple.x,player.y+9-pineapple.y)<32){win();return}
  if(player.y>S.checkpoint*H*.92+H*1.25){die();return}
  const target=H*.48;if(player.y-S.cam>target)S.cam=player.y-target;
  S.cam=Math.max(0,Math.min(S.cam,12*H*.92-H*.45));
  document.getElementById("section").textContent=Math.min(13,Math.floor(player.y/(H*.92))+1);
  document.getElementById("jumps").textContent=player.airJumps;
}
function draw(){
  const towerL=Math.max(20,W*.08),towerR=Math.min(W-20,W*.92);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#162532");g.addColorStop(1,"#030608");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#0c151c";ctx.fillRect(towerL,0,towerR-towerL,H);
  ctx.fillStyle="#17262f";ctx.fillRect(towerL+16,0,14,H);ctx.fillRect(towerR-30,0,14,H);
  // section separators and windows
  for(let y=-(S.cam%(H*.92));y<H+H*.92;y+=H*.92){ctx.fillStyle="#253944";ctx.fillRect(towerL,y+20,towerR-towerL,4);for(let x=towerL+55;x<towerR-40;x+=55){ctx.fillStyle="#29414c";ctx.fillRect(x,y+55,30,48)}}
  // platforms
  for(const p of levels){let px=p.x;if(p.kind==="moving")px=p.homeX+Math.sin(S.t*p.speed+p.phase)*p.range;const y=p.y-S.cam;if(y<-40||y>H+40)continue;
    ctx.fillStyle=p.kind==="checkpoint"?"#f3c54a":"#d5dde0";ctx.fillRect(px,y,p.w,p.h);ctx.fillStyle="#4a5b63";ctx.fillRect(px,y+p.h,p.w,7);
    if(p.kind==="checkpoint"){ctx.fillStyle="#ef4a4a";ctx.fillRect(px+p.w/2-3,y-24,6,24);ctx.fillRect(px+p.w/2+3,y-24,22,12)}
  }
  // lava
  for(const h of hazards)if(h.type==="lava"){const y=h.y-S.cam;ctx.fillStyle="#e34b29";ctx.fillRect(h.x,y,h.w,h.h);ctx.fillStyle="#ff9c38";for(let x=h.x;x<h.x+h.w;x+=24)ctx.beginPath(),ctx.arc(x,y+8+Math.sin(S.t*4+x)*4,12,0,Math.PI*2),ctx.fill()}
  // pipes
  for(const h of hazards)if(h.type==="pipe"){const y=h.y-S.cam;ctx.fillStyle="#5db6c7";ctx.fillRect(h.x,y,h.w,h.h);ctx.fillStyle="#8fe4ef";ctx.fillRect(h.x-6,y-8,h.w+12,14)}
  // blades
  for(const h of hazards)if(h.type==="blade"){const y=h.y-S.cam+Math.sin(S.t*2+h.phase)*24;ctx.save();ctx.translate(h.x,y);ctx.rotate(S.t*5);ctx.fillStyle="#e9eef0";ctx.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8,r=i%2?h.r:h.r*.42;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}
  // flappy pickups
  for(const f of flappys)if(!f.collected){const y=f.y-S.cam;ctx.save();ctx.translate(f.x,y);ctx.shadowColor="#7ff0ff";ctx.shadowBlur=20;ctx.fillStyle="#65dff2";ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#08202a";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.fillText("F",0,4);ctx.restore()}
  // boxes
  for(const b of boxes)if(!b.used){const y=b.y-S.cam+Math.sin(S.t*2+b.bob)*7;ctx.fillStyle="#f4b83f";ctx.fillRect(b.x,y,b.w,b.h);ctx.fillStyle="#fff0a5";ctx.font="bold 18px Arial";ctx.fillText("↑",b.x+8,y+22)}
  // pineapple
  if(!pineapple.collected){const y=pineapple.y-S.cam;ctx.save();ctx.translate(pineapple.x,y);ctx.shadowColor="#ffd84a";ctx.shadowBlur=24;ctx.fillStyle="#f5bd32";ctx.beginPath();ctx.ellipse(0,7,13,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#55a64c";ctx.beginPath();ctx.moveTo(-9,-7);ctx.lineTo(-4,-23);ctx.lineTo(0,-10);ctx.lineTo(6,-24);ctx.lineTo(10,-7);ctx.fill();ctx.restore()}
  // player
  const py=player.y-S.cam;ctx.save();ctx.translate(player.x+9,py+9);ctx.shadowColor="#68efff";ctx.shadowBlur=18;const pg=ctx.createLinearGradient(-9,-9,9,9);pg.addColorStop(0,"#fff");pg.addColorStop(.45,"#67eaff");pg.addColorStop(1,"#1977a8");ctx.fillStyle=pg;ctx.fillRect(-9,-9,18,18);ctx.shadowBlur=0;ctx.fillStyle="#09202a";ctx.fillRect(-3,-3,6,6);ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop)}
makeWorld();requestAnimationFrame(loop);
</script>
</body>
</html>
