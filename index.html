<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Quest</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#ui {
  position: fixed;
  top: 15px;
  left: 15px;
  color: white;
  font-weight: bold;
  font-size: 20px;
  text-shadow: 2px 2px #000;
  z-index: 5;
}

#message {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: white;
  background: rgba(0,0,0,.65);
  z-index: 10;
}

#message h1 {
  font-size: 55px;
  margin-bottom: 15px;
}

#message button {
  padding: 12px 25px;
  font-size: 20px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  color: white;
  opacity: .8;
  text-shadow: 2px 2px #000;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  Coins: <span id="coins">0</span>
  &nbsp;&nbsp;
  Lives: <span id="lives">3</span>
</div>

<div id="controls">
  ← → / A D = Move &nbsp;&nbsp; Space / W = Jump
</div>

<div id="message">
  <h1 id="messageTitle">GAME OVER</h1>
  <button onclick="restart()">Restart</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (
    ["arrowleft", "arrowright", "arrowup", " ", "w", "a", "d"].includes(
      e.key.toLowerCase()
    )
  ) {
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

const world = {
  width: 9000,
  gravity: 0.65
};

let cameraX = 0;
let coins = 0;
let lives = 3;
let gameOver = false;

const player = {
  x: 120,
  y: 400,
  width: 38,
  height: 52,
  vx: 0,
  vy: 0,
  speed: 0.65,
  maxSpeed: 7,
  jump: 14,
  grounded: false,
  color: "#35a7ff"
};

const platforms = [
  {x:0, y:520, w:900, h:80},
  {x:1050, y:520, w:650, h:80},
  {x:1800, y:470, w:500, h:130},
  {x:2450, y:520, w:850, h:80},
  {x:3450, y:450, w:500, h:150},
  {x:4100, y:520, w:900, h:80},
  {x:5200, y:430, w:600, h:170},
  {x:6000, y:520, w:1000, h:80},
  {x:7200, y:460, w:650, h:140},
  {x:8050, y:520, w:950, h:80}
];

const blocks = [
  {x:500, y:420, w:50, h:50},
  {x:560, y:420, w:50, h:50},
  {x:1200, y:400, w:50, h:50},
  {x:1250, y:350, w:50, h:50},
  {x:1950, y:350, w:50, h:50},
  {x:2700, y:420, w:50, h:50},
  {x:2750, y:420, w:50, h:50},
  {x:4700, y:400, w:50, h:50},
  {x:4750, y:350, w:50, h:50},
  {x:6300, y:420, w:50, h:50}
];

const coinList = [];

function addCoins(x, y, amount, spacing = 55) {
  for (let i = 0; i < amount; i++) {
    coinList.push({
      x: x + i * spacing,
      y,
      collected: false
    });
  }
}

addCoins(250, 450, 6);
addCoins(1100, 450, 5);
addCoins(1850, 400, 5);
addCoins(2550, 450, 8);
addCoins(3500, 380, 5);
addCoins(4200, 450, 8);
addCoins(5250, 360, 6);
addCoins(6100, 450, 8);
addCoins(7300, 400, 6);
addCoins(8200, 450, 8);

const enemies = [
  {x:650, y:475, w:38, h:38, vx:-1.5, alive:true},
  {x:1300, y:475, w:38, h:38, vx:1.4, alive:true},
  {x:2050, y:425, w:38, h:38, vx:-1.5, alive:true},
  {x:2850, y:475, w:38, h:38, vx:1.7, alive:true},
  {x:3650, y:405, w:38, h:38, vx:-1.3, alive:true},
  {x:4450, y:475, w:38, h:38, vx:1.5, alive:true},
  {x:5450, y:385, w:38, h:38, vx:-1.5, alive:true},
  {x:6500, y:475, w:38, h:38, vx:1.6, alive:true},
  {x:7500, y:415, w:38, h:38, vx:-1.5, alive:true}
];

const goal = {
  x:9400,
  y:420,
  w:30,
  h:100
};

function rectsOverlap(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.width > b.x &&
    a.y < b.y + b.h &&
    a.y + a.height > b.y
  );
}

function resetPlayer() {
  player.x = 120;
  player.y = 300;
  player.vx = 0;
  player.vy = 0;
}

function loseLife() {
  lives--;

  if (lives <= 0) {
    gameOver = true;
    document.getElementById("messageTitle").textContent = "GAME OVER";
    document.getElementById("message").style.display = "flex";
  } else {
    resetPlayer();
  }
}

function update() {
  if (gameOver) return;

  // Movement
  if (keys["arrowright"] || keys["d"]) {
    player.vx += player.speed;
  }

  if (keys["arrowleft"] || keys["a"]) {
    player.vx -= player.speed;
  }

  player.vx *= 0.82;

  if (player.vx > player.maxSpeed)
    player.vx = player.maxSpeed;

  if (player.vx < -player.maxSpeed)
    player.vx = -player.maxSpeed;

  // Jump
  if (
    (keys[" "] || keys["w"] || keys["arrowup"]) &&
    player.grounded
  ) {
    player.vy = -player.jump;
    player.grounded = false;
  }

  player.vy += world.gravity;

  player.x += player.vx;
  player.y += player.vy;

  if (player.x < 0)
    player.x = 0;

  player.grounded = false;

  // Platform collisions
  for (const p of platforms) {
    if (
      player.x + player.width > p.x &&
      player.x < p.x + p.w &&
      player.y + player.height > p.y &&
      player.y + player.height - player.vy <= p.y
    ) {
      player.y = p.y - player.height;
      player.vy = 0;
      player.grounded = true;
    }
  }

  // Block collisions
  for (const b of blocks) {
    if (
      player.x + player.width > b.x &&
      player.x < b.x + b.w &&
      player.y + player.height > b.y &&
      player.y + player.height - player.vy <= b.y
    ) {
      player.y = b.y - player.height;
      player.vy = 0;
      player.grounded = true;
    }
  }

  // Falling
  if (player.y > canvas.height + 200) {
    loseLife();
  }

  // Coins
  for (const coin of coinList) {
    if (coin.collected) continue;

    const box = {
      x: coin.x,
      y: coin.y,
      width: 24,
      height: 24
    };

    if (rectsOverlap(player, box)) {
      coin.collected = true;
      coins++;
    }
  }

  // Enemies
  for (const enemy of enemies) {
    if (!enemy.alive) continue;

    enemy.x += enemy.vx;

    // Simple patrol
    if (enemy.x < 100 || enemy.x > world.width - 100) {
      enemy.vx *= -1;
    }

    const ebox = {
      x: enemy.x,
      y: enemy.y,
      width: enemy.w,
      height: enemy.h
    };

    if (rectsOverlap(player, ebox)) {

      // Jump on enemy
      if (player.vy > 0 && player.y + player.height - player.vy <= enemy.y + 10) {
        enemy.alive = false;
        player.vy = -9;
      } else {
        loseLife();
      }
    }
  }

  // Goal
  if (
    player.x + player.width > goal.x &&
    player.x < goal.x + goal.w
  ) {
    gameOver = true;
    document.getElementById("messageTitle").textContent = "LEVEL COMPLETE!";
    document.getElementById("message").style.display = "flex";
  }

  // Camera
  cameraX = player.x - canvas.width * 0.35;

  if (cameraX < 0)
    cameraX = 0;

  if (cameraX > world.width - canvas.width)
    cameraX = world.width - canvas.width;

  document.getElementById("coins").textContent = coins;
  document.getElementById("lives").textContent = lives;
}

function drawBackground() {
  // Sky
  const gradient = ctx.createLinearGradient(
    0, 0,
    0, canvas.height
  );

  gradient.addColorStop(0, "#63c9ff");
  gradient.addColorStop(1, "#d9f5ff");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Clouds
  ctx.fillStyle = "rgba(255,255,255,.8)";

  for (let i = 0; i < 20; i++) {
    const x = i * 550 - cameraX * 0.25;
    const y = 80 + (i % 4) * 65;

    ctx.beginPath();
    ctx.arc(x, y, 30, 0, Math.PI * 2);
    ctx.arc(x + 35, y - 15, 38, 0, Math.PI * 2);
    ctx.arc(x + 75, y, 30, 0, Math.PI * 2);
    ctx.fill();
  }

  // Far mountains
  ctx.fillStyle = "#8bd08b";

  for (let i = 0; i < 20; i++) {
    const x = i * 600 - cameraX * 0.45;

    ctx.beginPath();
    ctx.moveTo(x, 520);
    ctx.lineTo(x + 250, 250);
    ctx.lineTo(x + 500, 520);
    ctx.fill();
  }
}

function drawPlatform(p) {
  const x = p.x - cameraX;

  if (x + p.w < 0 || x > canvas.width)
    return;

  ctx.fillStyle = "#7b4a27";
  ctx.fillRect(x, p.y, p.w, p.h);

  ctx.fillStyle = "#4caf50";
  ctx.fillRect(x, p.y, p.w, 18);

  ctx.fillStyle = "#68c85a";

  for (let i = 0; i < p.w; i += 35) {
    ctx.fillRect(x + i, p.y + 18, 22, 8);
  }
}

function drawBlock(b) {
  const x = b.x - cameraX;

  ctx.fillStyle = "#e8a52e";
  ctx.fillRect(x, b.y, b.w, b.h);

  ctx.strokeStyle = "#a66b18";
  ctx.lineWidth = 4;
  ctx.strokeRect(x, b.y, b.w, b.h);

  ctx.fillStyle = "#fff0a0";
  ctx.font = "28px Arial";
  ctx.textAlign = "center";
  ctx.fillText("?", x + b.w / 2, b.y + 36);
}

function drawCoin(c) {
  const x = c.x - cameraX;

  if (x < -30 || x > canvas.width + 30)
    return;

  ctx.fillStyle = "#ffd92f";
  ctx.beginPath();
  ctx.arc(x + 12, c.y + 12, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#d99c00";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = "#fff5a3";
  ctx.fillRect(x + 8, c.y + 5, 4, 13);
}

function drawEnemy(e) {
  const x = e.x - cameraX;

  if (x < -50 || x > canvas.width + 50)
    return;

  // Body
  ctx.fillStyle = "#8d3cff";
  ctx.fillRect(x, e.y, e.w, e.h);

  // Eyes
  ctx.fillStyle = "white";
  ctx.fillRect(x + 7, e.y + 8, 9, 10);
  ctx.fillRect(x + 22, e.y + 8, 9, 10);

  ctx.fillStyle = "#111";
  ctx.fillRect(x + 10, e.y + 11, 4, 6);
  ctx.fillRect(x + 25, e.y + 11, 4, 6);

  // Feet
  ctx.fillStyle = "#512080";
  ctx.fillRect(x - 3, e.y + e.h - 5, 16, 8);
  ctx.fillRect(x + 25, e.y + e.h - 5, 16, 8);
}

function drawPlayer() {
  const x = player.x - cameraX;

  // Body
  ctx.fillStyle = player.color;
  ctx.fillRect(x, player.y + 14, player.width, player.height - 14);

  // Head
  ctx.fillStyle = "#ffd0a1";
  ctx.fillRect(x + 6, player.y, 26, 25);

  // Hair
  ctx.fillStyle = "#49301f";
  ctx.fillRect(x + 4, player.y - 2, 30, 8);

  // Eye
  ctx.fillStyle = "#111";
  ctx.fillRect(x + 24, player.y + 8, 4, 5);

  // Shoes
  ctx.fillStyle = "#222";
  ctx.fillRect(x - 3, player.y + player.height - 8, 18, 8);
  ctx.fillRect(x + 22, player.y + player.height - 8, 18, 8);

  // Shirt stripe
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(x + 7, player.y + 28, 24, 5);
}

function drawGoal() {
  const x = goal.x - cameraX;

  ctx.fillStyle = "#eee";
  ctx.fillRect(x, goal.y, 8, goal.h);

  ctx.fillStyle = "#ff4d5a";

  ctx.beginPath();
  ctx.moveTo(x + 8, goal.y);
  ctx.lineTo(x + 60, goal.y + 20);
  ctx.lineTo(x + 8, goal.y + 40);
  ctx.fill();
}

function draw() {
  drawBackground();

  for (const p of platforms)
    drawPlatform(p);

  for (const b of blocks)
    drawBlock(b);

  for (const coin of coinList) {
    if (!coin.collected)
      drawCoin(coin);
  }

  for (const enemy of enemies) {
    if (enemy.alive)
      drawEnemy(enemy);
  }

  drawGoal();
  drawPlayer();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function restart() {
  coins = 0;
  lives = 3;
  gameOver = false;

  for (const coin of coinList)
    coin.collected = false;

  for (const enemy of enemies)
    enemy.alive = true;

  resetPlayer();

  document.getElementById("message").style.display = "none";
}

gameLoop();
</script>

</body>
</html>
